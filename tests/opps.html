<!doctype html>
<meta charset="utf-8">
<title>Marrow Bay daily opportunities test</title>
<style>body{font:14px system-ui;margin:16px}pre{white-space:pre-wrap}.ok{color:#2f7a3c}.bad{color:#b5472f}iframe{width:400px;height:420px;border:1px solid #888}</style>
<h2>Today's opportunities</h2>
<p id="verdict">Running...</p>
<pre id="out"></pre>
<iframe id="game" src="../index.html"></iframe>
<script>
/* Each morning up to three opportunities of different kinds appear, drawn from the tide, a district, a rumor and someone who needs help; they last three days,
   show at the top of the feed with an action button, light the unread dot, are cleared by acting, and save. */
const f = document.getElementById('game');
f.addEventListener('load', async () => {
  const win = f.contentWindow, errs = [], doc = win.document, stats = {};
  const api = win.eval(`({get G(){return G},FOUND,foundFlats,foundHourly,oppArrive,oppGoalCheck,BG,NPC,POIS,METERS,start,closeMenu,popClear,oppsDaily,oppAct,oppUnread,baywatchMenu,feedUnread,addRumor,phone,hud,migrate,day,npcS})`);
  const G = () => api.G, text = () => doc.getElementById('sheet').innerText, btns = () => [...doc.querySelectorAll('#sheet #actions button')];
  const setDay = d => { G().t = (d - 1) * 1440 + 600 };
  try {
    api.start(Object.keys(api.BG)[0]); G().flags.customDone = true; api.closeMenu(); api.popClear(); G().flags.onboarded = true; win.eval('SET.hints=false');
    G().opening = { step: 'done', done: true }; setDay(3);
    // a quiet new game: only the tide is always available
    api.oppsDaily(); stats.first = G().opps.map(o => o.kind); if (!G().opps.length) errs.push('no opportunity on a quiet day: ' + JSON.stringify(stats.first));
    // make the city interesting: a booming district, a rumor, a hungry friend
    G().meters.Dockside = 90; G().meters.Grid = 10; api.addRumor('thief', ['mina', 'reyes']); G().met.mina = 1; api.npcS(api.NPC.mina).hunger = 10;
    G().opps = []; G().oppId = 0; G().oppSeen = 0; setDay(4); api.oppsDaily();
    const k = G().opps.map(o => o.kind); stats.second = k; if (G().opps.length !== 3) errs.push('expected three opportunities, got ' + G().opps.length); if (new Set(k).size !== k.length) errs.push('a kind repeated: ' + k);
    G().opps.forEach(o => { if (!o.t || /\{|undefined/.test(o.t) || !o.act || !o.act.label) errs.push('bad opportunity ' + o.kind + ': ' + o.t); if (o.until !== o.day + 2) errs.push('life is not three days for ' + o.kind) });
    // every kind can be generated and acted on
    const kinds = ['tide', 'district', 'rumor', 'person', 'errand', 'lostitem', 'delivery', 'dare', 'tidejob', 'legend', 'favour', 'repair'], seen = {};
    G().inv.scrap = 5; G().inv.parts = 2; G().inv.meals = 2; Object.keys(api.NPC).slice(0, 8).forEach(i => { G().met[i] = 1 });
    let back = 0;
    for (let d = 5; d < 120; d++) { const prev = (G().oppPrev || []).slice(); G().opps = []; setDay(d); api.oppsDaily(); if (G().opps.length === 3 && G().opps.some(o => prev.includes(o.kind))) back++; G().opps.forEach(o => { seen[o.kind] = o }) }
    kinds.forEach(x => { if (!seen[x]) errs.push('kind never generated: ' + x) }); stats.backToBack = back; if (back > 6) errs.push('kinds repeat back to back too often: ' + back);
    // every task kind can be finished: the right place, time, tide and items pay out and close it
    kinds.slice(4).forEach(k => { const o = seen[k]; if (!o || !o.goal) return errs.push('task kind has no goal: ' + k); G().opps = [o]; G().inv.scrap = 5; G().inv.parts = 2; G().inv.meals = 2; G().heat = 0; const g = o.goal;
      if (g.hrs) { G().t = Math.floor(G().t / 1440) * 1440 + 23 * 60 } if (g.tide) { let m = G().t; while (win.eval('tideName(' + m + ')') !== 'low') m += 5; G().t = m }
      const c0 = G().cash; api.oppArrive(o); if (G().opps.length) errs.push('task not completed: ' + k); if (g.cash && G().cash < c0 + g.cash) errs.push('task did not pay: ' + k) });
    // a task with an unmet need does not pay
    { const o = { id: 99, kind: 'x', until: 999, goal: { x: 1, y: 1, need: { parts: 99 }, cash: 50 } }; G().opps = [o]; const c0 = G().cash; api.oppArrive(o); if (G().cash !== c0 || !G().opps.length) errs.push('unmet need paid out') }
    // found moments: ten, each once, at most one a day, saved
    if (api.FOUND.length !== 10) errs.push('expected 10 found moments'); G().found = {}; G().flags.onboarded = true; G().opening = { step: 'done', done: true }; let fired = 0, run = 0;
    const oldR = win.Math.random; win.Math.random = () => 0;
    for (let d = 200; d < 1400 && fired < 10; d++) { setDay(d); for (let i = 0; i < 6; i++) { G().t += 1440 * 0 + 60 * 0; const cnt = () => Object.keys(G().found).filter(x => x !== 'last').length, before = cnt(); G().t = Math.floor(G().t / 1440) * 1440 + 360 + i * 120; const spring = win.eval('tideCycle()'); api.foundFlats(); G().p.x = 20; G().p.y = 20; api.foundHourly(G().t / 60); if (cnt() > before + 1) errs.push('two found moments in one go'); } fired = Object.keys(G().found).filter(x => x !== 'last').length; win.eval('popClear()') }
    win.Math.random = oldR; stats.found = fired; if (fired < 8) errs.push('found moments that can fire: ' + fired);
    const before = JSON.stringify(G().found); setDay(1500); G().found.last = 0; api.foundFlats(); if (Object.keys(G().found).length !== fired + 1 && JSON.stringify(G().found) !== before && fired === 10) errs.push('a found moment fired twice');
    // unread and the feed
    G().opps = []; G().oppId = 0; G().oppSeen = 0; setDay(6); api.oppsDaily(); G().feedSeen = G().feedId || 0; G().sugSeen = ''; const u = api.feedUnread(); if (u < 1) errs.push('no unread dot for new opportunities');
    api.baywatchMenu(); if (!/Today/.test(text())) errs.push('feed does not show Today posts'); if (api.oppUnread() !== 0) errs.push('opening the feed did not clear unread');
    const bt = btns().map(b => b.innerText.replace(/\n.*/, '')); const want = G().opps.map(o => o.act.label); want.forEach(w => { if (!bt.includes(w)) errs.push('no button: ' + w) });
    // acting on one removes it and does the thing
    const taskOpp = G().opps.find(o => o.goal); if (taskOpp) { api.oppAct(taskOpp); if (!taskOpp.taken || !G().opps.includes(taskOpp)) errs.push('a task should stay listed once taken') }
    const walkOpp = G().opps.find(o => o.act.type === 'walk' && !o.goal), n0 = G().opps.length; if (walkOpp) { api.oppAct(walkOpp); if (G().opps.length !== n0 - 1) errs.push('acting did not clear it'); if (!G().p.path.length && !(Math.round(G().p.x) === walkOpp.act.x && Math.round(G().p.y) === walkOpp.act.y)) errs.push('walk did not start') }
    const talkOpp = Object.values(seen).find(o => o.act.type === 'talk'); if (talkOpp) { G().opps = [talkOpp]; api.oppAct(talkOpp); if (G().opps.length) errs.push('talk opportunity not cleared') }
    G().opps = [Object.values(seen).find(o => o.act.type === 'bag')]; api.oppAct(G().opps[0]); if (!/Standing|Bag/i.test(text())) errs.push('rumor action did not open the Bag');
    // they expire after three days and are replaced
    api.closeMenu(); G().opps = []; setDay(10); api.oppsDaily(); const born = G().opps.map(o => o.id); setDay(13); api.oppsDaily(); if (G().opps.some(o => born.includes(o.id))) errs.push('opportunities did not expire after three days');
    // old saves and saves
    win.eval('delete G.opps;delete G.oppId;delete G.oppSeen;migrate()'); if (!Array.isArray(G().opps) || G().oppSeen !== G().oppId) errs.push('old save not given opportunity fields');
    G().opps = []; setDay(20); api.oppsDaily(); win.eval('G=JSON.parse(JSON.stringify(G));migrate()'); if (!G().opps.length) errs.push('opportunities lost in a save');
  } catch (e) { errs.push(e.message + ' ' + (e.stack || '').split('\n')[1]) }
  const v = document.getElementById('verdict');
  v.className = errs.length ? 'bad' : 'ok'; v.textContent = errs.length ? errs.length + ' errors' : 'No errors.';
  document.getElementById('out').textContent = errs.slice(0, 25).join('\n') + '\n' + JSON.stringify(stats);
  window.__done = { ok: !errs.length, errs, stats };
});
</script>
