<!doctype html>
<meta charset="utf-8">
<title>Marrow Bay scene contact sheet</title>
<style>body{font:13px system-ui;margin:12px;background:#10202a;color:#e6efe9}.g{display:grid;grid-template-columns:repeat(auto-fill,320px);gap:10px}.c{width:320px}canvas{width:320px;height:160px;image-rendering:pixelated;display:block;border:2px solid #2f4a5b}</style>
<h3>Scene contact sheet (a look at every scene, not a pass or fail test)</h3>
<p>Add ?only=nature,eat to show some types, ?big=1 (or 2) for large views. Add ?t=800&p=0.5 to pick the moment. Add ?skin=3&hair=1&style=4&outfit=rust to try another look.</p>
<div class="g" id="grid"></div>
<iframe id="game" src="../index.html" style="display:none"></iframe>
<script>
const f = document.getElementById('game');
f.addEventListener('load', () => {
  const win = f.contentWindow, q = new URLSearchParams(location.search);
  if (q.get('big')) document.head.insertAdjacentHTML('beforeend', '<style>.g{grid-template-columns:repeat(' + (+q.get('big') || 1) + ',' + Math.floor(780 / (+q.get('big') || 1)) + 'px)}.c{width:auto}canvas{width:100%;height:auto;aspect-ratio:2}h3,p{display:none}</style>');
  const only = (q.get('only') || '').split(',').filter(Boolean), t = +(q.get('t') || 700), p = +(q.get('p') || .5);
  win.eval(`start(Object.keys(BG)[0]);G.look.skin=${+(q.get('skin') || 1)};G.look.hair=${+(q.get('hair') || 0)};G.look.style=${+(q.get('style') || 0)};G.look.outfit=${JSON.stringify(q.get('outfit') || 'blue')}`);
  const rules = win.eval('SCENE_RULES'), DRAW = win.eval('SCENE_DRAW'), seen = new Set(), grid = document.getElementById('grid');
  /* ?strip=social:friendly plays one scene as a filmstrip of eight moments */
  /* ?ctx=who:mina;phone:1 or ctx=bkey:diner;level:2 or ctx=where:Dockside sets what the open menu would tell the scene */
  if (q.get('ctx')) { const o = {}; q.get('ctx').split(';').forEach(kv => { const [k, v] = kv.split(':'); o[k] = k === 'who' ? win.eval('NPC')[v] : k === 'level' ? +v : k === 'phone' ? true : v }); win.eval('sceneCtx')(o) }
  if (q.get('strip')) {
    /* several scenes, four moments each: ?strip=sneaky:pry,sneaky:stash */
    const list = q.get('strip').split(','), moments = list.length > 1 ? [.12, .4, .66, .92] : [.04, .17, .3, .43, .56, .69, .82, .95];
    list.forEach(sk => { const [ty, kit] = sk.split(':'), dur = win.eval('SCENE_MS')[ty] || 2000;
    moments.forEach(pp => {
      const c = document.createElement('div'); c.className = 'c';
      const cv = document.createElement('canvas'); cv.width = 160; cv.height = 80; c.appendChild(cv);
      const lab = document.createElement('div'); lab.textContent = (list.length > 1 ? sk + ' ' : '') + 'p=' + pp.toFixed(2); c.appendChild(lab); grid.appendChild(c);
      try { DRAW[ty](cv.getContext('2d'), pp * dur, pp, kit || '') } catch (e) { lab.textContent += ' ERROR ' + e.message }
    }) });
    window.__done = true; return;
  }
  rules.forEach(r => {
    const key = r[1] + ':' + r[2]; if (seen.has(key)) return; if (only.length && !only.includes(r[1])) return; seen.add(key);
    const c = document.createElement('div'); c.className = 'c';
    const cv = document.createElement('canvas'); cv.width = 160; cv.height = 80; c.appendChild(cv);
    const lab = document.createElement('div'); lab.textContent = key + ' (t=' + t + ')'; c.appendChild(lab); grid.appendChild(c);
    try { cv.getContext('2d').clearRect(0, 0, 160, 80); DRAW[r[1]](cv.getContext('2d'), t, p, r[2]) } catch (e) { lab.textContent += ' ERROR ' + e.message }
  });
  window.__done = true;
});
</script>
