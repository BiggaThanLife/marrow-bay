<!doctype html><meta charset="utf-8"><title>Tile sheet picker</title>
<style>body{margin:0;background:#222;color:#fff;font:10px monospace}canvas{image-rendering:pixelated}</style>
<canvas id="c"></canvas>
<script>
/* Shows an atlas at 3x with the 16px grid and each cell's column,row so tiles can be picked by index. ?f=roads.png */
const q=new URLSearchParams(location.search),f=q.get('f')||'roads.png',S=+(q.get('s')||3),T=+(q.get('t')||16);
const im=new Image();im.onload=()=>{const c=document.getElementById('c'),g=c.getContext('2d');
 c.width=im.width*S;c.height=im.height*S;g.fillStyle='#ff00ff33';g.fillRect(0,0,c.width,c.height);g.imageSmoothingEnabled=false;g.drawImage(im,0,0,c.width,c.height);
 g.strokeStyle='rgba(255,255,0,.5)';g.fillStyle='#ff0';
 for(let y=0;y<im.height/T;y++)for(let x=0;x<im.width/T;x++){g.strokeRect(x*T*S+.5,y*T*S+.5,T*S,T*S);g.fillText(x+','+y,x*T*S+2,y*T*S+10)}
 window.__done=true};
im.src='../assets/city/'+f;
</script>
