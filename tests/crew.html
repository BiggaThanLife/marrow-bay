<!doctype html>
<meta charset="utf-8">
<title>Marrow Bay crew test</title>
<style>body{font:14px system-ui;margin:16px}pre{white-space:pre-wrap}.ok{color:#2f7a3c}.bad{color:#b5472f}iframe{width:400px;height:420px;border:1px solid #888}</style>
<h2>Crew, rival crews, big jobs and the casino cage</h2>
<p id="verdict">Running...</p>
<pre id="out"></pre>
<iframe id="game" src="../index.html"></iframe>
<script>
/* Hiring, wages and loyalty, quitting and informing, jobs (guard and hustle), bail; rival hits held or lost, striking back and tribute;
   planning a big job (casing, gear, crew), the twist, success with the crew's cut, failure with arrests, calling it off; the casino cage; menus open; save and load. */
const f = document.getElementById('game');
f.addEventListener('load', () => {
  const win = f.contentWindow, errs = [], doc = win.document, stats = {};
  const api = win.eval(`({get G(){return G},BG,POIS,NPC,MENUS,start,closeMenu,popClear,alertQ,advance,day,save,migrate,
    CREW_POOL,HEISTS,crewHire,crewFire,crewDaily,crewCandidates,crewSkill,crewSetJob,crewBailOut,crewJail,crewDef,crewWage,rivalDaily,rivalDefense,rivalStrike,rivalTribute,tributeCost,rivalOwner,
    heistPlan,heistBuy,heistCaseAt,heistOdds,heistResolve,heistGearReady,heistRolesMissing,heistGo,heistBoard,heistPlanMenu,crewMenu,crewRecruit,crewMember,territoryMenu,cageMenu,cageWash,cageLeft,cageFee,racketPay,RACKETS,missionTick,playerRackets})`);
  const G = () => api.G, sheet = () => doc.getElementById('sheet').innerText, btns = () => [...doc.querySelectorAll('#sheet #actions button')], flush = () => { api.popClear(); api.alertQ.length = 0; };
  const click = rx => { const b = btns().find(x => rx.test(x.innerText)); if (!b) return false; if (b.disabled) return 'disabled'; b.click(); return true };
  const rnd = win.Math.random, fix = v => { win.Math.random = () => v }, unfix = () => { win.Math.random = rnd };
  try {
    api.start(Object.keys(api.BG)[0]); G().flags.customDone = true; api.closeMenu(); flush(); G().flags.onboarded = false;
    G().cash = 5000; G().dirty = 0; G().notor = 0; G().heat = 0;
    // data
    if (api.CREW_POOL.length < 8) errs.push('crew pool too small');
    ['driver', 'muscle', 'lock', 'look'].forEach(r => { if (!api.CREW_POOL.some(c => c.role === r)) errs.push('no ' + r + ' in pool') });
    api.HEISTS.forEach(h => { if (!api.POIS[h.poi]) errs.push('heist place missing ' + h.poi); if (h.twists.length < 1) errs.push('no twists ' + h.id) });
    // candidates: three, stable within the week
    const c1 = api.crewCandidates().map(c => c.id).join(), c2 = api.crewCandidates().map(c => c.id).join();
    if (api.crewCandidates().length !== 3 || c1 !== c2) errs.push('candidates not 3 and stable: ' + c1 + ' / ' + c2);
    // hire: fee from dirty first
    G().dirty = 1000; const lou = 'lou', fee = api.crewWage(api.crewDef(lou)) * 3;
    api.crewHire(lou); if (G().crew.length !== 1 || G().dirty !== 1000 - fee || G().cash !== 5000) errs.push('hire fee not paid from dirty cash');
    ['odette', 'june', 'rafi'].forEach(id => api.crewHire(id));
    if (G().crew.length !== 4) errs.push('could not hire four'); if (!/full/.test(api.crewHire('mei'))) errs.push('crew max not enforced');
    if (api.crewSkill('muscle') !== 3 || api.crewSkill('lock') !== 3) errs.push('crewSkill wrong');
    // wages: paid -> loyalty up; unpaid -> loyalty down
    const loy0 = G().crew[0].loy; G().dirty = 1000; api.crewDaily(); if (!(G().crew[0].loy > loy0)) errs.push('paid crew loyalty did not rise');
    G().dirty = 0; G().cash = 0; const l1 = G().crew[0].loy; api.crewDaily(); flush(); if (!(G().crew[0].loy < l1)) errs.push('unpaid crew loyalty did not fall');
    // quitting at low loyalty, informing when loose-lipped and known
    G().cash = 5000; G().dirty = 1000; api.crewHire === undefined;
    G().crew.find(m => m.id === 'june').loy = 5; G().notor = 30; const n0 = G().notor; G().dirty = 0; G().cash = 0; fix(.99); api.crewDaily(); unfix(); flush(); G().cash = 5000; G().crew.forEach(m => { m.loy = 60 });
    if (G().crew.some(m => m.id === 'june')) errs.push('crew did not quit at low loyalty');
    if (!(G().notor > n0)) errs.push('quitting at rock bottom did not inform');
    G().notor = 0;
    // hustle earns dirty cash; guards raise racket pay
    api.crewSetJob('rafi', 'hustle'); G().dirty = 500; const d0 = G().dirty; fix(.5); api.crewDaily(); unfix(); flush(); if (!(G().dirty > d0 - 200)) errs.push('hustle/wages math odd');
    G().turf.door = 'player'; const r = api.RACKETS.find(x => x.id === 'door'), pay0 = api.racketPay(r); api.crewSetJob('lou', 'guard'); if (!(api.racketPay(r) > pay0)) errs.push('guards did not raise racket pay');
    // jail and bail
    const od = G().crew.find(m => m.id === 'odette'); api.crewJail(od, 3, 'test'); flush(); if (api.crewSkill('lock') !== 0) errs.push('jailed member still counted');
    G().cash = 5000; api.crewBailOut('odette'); if (api.crewSkill('lock') !== 3) errs.push('bail did not free');
    // rival: defended hit and lost hit
    G().rival.truce = 0; G().arc = null; G().turf.pawn = 'salt';
    fix(.0); api.rivalDaily(); unfix(); flush(); if (G().turf.door !== 'player' || !(G().rival.held >= 1)) errs.push('defended hit did not hold');
    api.crewSetJob('lou', 'idle'); G().rival.str = 100; const def = api.rivalDefense(); stats.weakDefense = def;
    let calls = 0; win.Math.random = () => { calls++; return calls === 1 ? 0 : .99 }; api.rivalDaily(); unfix(); flush();
    if (G().turf.door === 'player') errs.push('lost hit did not take the racket (' + def + ')');
    else if (G().turf.door !== api.rivalOwner()) errs.push('racket went to the wrong owner ' + G().turf.door);
    G().turf.door = 'player';
    // strike back and tribute
    G().energy = 100; G().rival.str = 50; fix(.0); api.rivalStrike(); unfix(); if (G().rival.str !== 35) errs.push('strike did not weaken rival');
    G().dirty = 2000; const tc = api.tributeCost(); api.rivalTribute(); if (!(G().rival.truce > api.day()) || G().dirty !== 2000 - tc) errs.push('tribute');
    const turfBefore = G().turf.door; fix(.0); api.rivalDaily(); unfix(); if (G().turf.door !== turfBefore) errs.push('truce did not stop hits');
    // big jobs: plan, case, gear, crew, odds
    G().heat = 0; G().notor = 0; G().crew.forEach(m => { m.jail = 0 }); api.heistPlan('yard');
    if (!G().heist || G().heist.intel !== 0) errs.push('plan not started');
    const o0 = api.heistOdds(); api.heistCaseAt(); if (!(G().heist.intel >= 30)) errs.push('casing gave too little intel ' + G().heist.intel);
    G().dirty = 1000; api.heistBuy('cutters'); if (!api.heistGearReady()) errs.push('gear not ready');
    if (api.heistRolesMissing().length) errs.push('roles missing ' + api.heistRolesMissing());
    if (!(api.heistOdds() > o0)) errs.push('odds did not improve');
    // casing through the mission system
    G().heist.intel = 0; G().mission = { type: 'case', title: 'x', stops: ['dock'], i: 0, deadline: G().t + 999, reward: 0 }; G().p.x = api.POIS.dock.ex; G().p.y = api.POIS.dock.ey; api.missionTick(); flush();
    if (G().mission || !(G().heist.intel > 0)) errs.push('case mission did not add intel');
    G().heist.intel = 80;
    // success: crew takes a cut, loyalty rises, cooldown set
    const loyB = G().crew.map(m => m.loy), dB = G().dirty; fix(.0); const ok = api.heistResolve(api.HEISTS.find(h => h.id === 'yard').twists[0].a[0]); unfix(); flush();
    if (!ok.ok || G().heist || !(G().dirty > dB)) errs.push('heist success ' + JSON.stringify(ok));
    if (!G().crew.every((m, i) => m.loy >= loyB[i])) errs.push('crew loyalty did not rise after a job');
    if (!(G().heistCool.yard > api.day()) || G().heistsDone !== 1) errs.push('cooldown or count');
    // abort keeps the plan
    api.heistPlan('van'); G().heist.intel = 60; G().heist.gear.spikes = true; const ab = api.heistResolve({ l: 'x', abort: true }); if (ab.ok !== null || !G().heist) errs.push('abort lost the plan');
    // failure: heat, arrests possible
    G().heat = 0; fix(.99); const bad = api.heistResolve(null); unfix(); flush(); if (bad.ok !== false || !(G().heat >= 4)) errs.push('heist failure');
    // the night mission runs the twist screen
    G().heat = 0; api.heistPlan('gala'); G().heistsDone = 1; G().heist.intel = 60; G().heist.gear.suit = true;
    G().mission = { type: 'bigjob', title: 'x', stops: ['estate'], i: 0, deadline: G().t + 9999, reward: 0, night: true }; G().p.x = api.POIS.estate.ex; G().p.y = api.POIS.estate.ey;
    while (!win.eval('isNight()')) api.advance(60, false, true); flush(); G().mission.deadline = G().t + 9999; api.missionTick();
    if (G().mission || !/You are in/.test(sheet())) errs.push('night job did not open the twist'); fix(.0); click(/./); unfix(); flush();
    if (G().heist) errs.push('job not resolved from the twist screen'); api.closeMenu();
    // casino cage
    G().dirty = 1000; G().turf.casino = 'vex'; const cash0 = G().cash, got = api.cageWash(9999);
    if (got !== Math.round(300 * (1 - api.cageFee())) || G().cash !== cash0 + got || G().dirty !== 700) errs.push('cage wash ' + got);
    if (api.cageLeft() !== 0 || api.cageWash(100) !== 0) errs.push('cage cap');
    // menus open without errors
    G().dirty = 500; api.crewMenu(); if (!/Your crew/.test(sheet())) errs.push('crew menu'); api.crewRecruit(); api.crewMember(G().crew[0].id); api.heistBoard(); api.heistPlanMenu();
    api.territoryMenu(api.POIS.velvet, api.NPC.vex); if (!/would hold|paid off/.test(sheet())) errs.push('territory lacks rival line');
    api.MENUS.casino(api.POIS.casino, api.NPC.vex);
    api.MENUS.velvet(api.POIS.velvet, api.NPC.vex); if (!/Big jobs/.test(sheet()) || !/Your crew/.test(sheet())) errs.push('velvet lacks buttons'); api.closeMenu();
    // save and load
    const keep = JSON.stringify([G().crew, G().rival, G().heist, G().heistsDone]); api.save(); win.eval('G=JSON.parse(localStorage.getItem("marrowbay_v3"));migrate();');
    if (JSON.stringify([G().crew, G().rival, G().heist, G().heistsDone]) !== keep) errs.push('crew state not saved');
    // an old save without crew fields
    win.eval('delete G.crew;delete G.rival;delete G.heist;delete G.heistsDone;delete G.heistCool;migrate();'); if (!Array.isArray(G().crew) || !G().rival) errs.push('migrate defaults');
    stats.days = api.day();
  } catch (e) { errs.push(e.message + ' ' + (e.stack || '').split('\n')[1]) }
  unfix();
  const v = document.getElementById('verdict');
  v.className = errs.length ? 'bad' : 'ok'; v.textContent = errs.length ? errs.length + ' errors' : 'No errors.';
  document.getElementById('out').textContent = errs.slice(0, 30).join('\n') + '\n' + JSON.stringify(stats);
  window.__done = { ok: !errs.length, errs, stats };
});
</script>
