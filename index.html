<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<style>
:root{
  --bg:#e3edef; --panel:#f6fafa; --line:#aebfc6; --text:#14262f; --muted:#506671;
  --accent:#0f8f7c; --accent-ink:#ffffff; --warn:#b5472f; --good:#2f7a3c; --amber:#a76d0b;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10202a; --panel:#1a2f3c; --line:#2f4a5b; --text:#e6efe9; --muted:#9bb2bc;
    --accent:#4fd1b5; --accent-ink:#0d1b22; --warn:#ff9a7a; --good:#8fd49a; --amber:#f2b84b;
  }
}
:root[data-theme="dark"]{
  --bg:#10202a; --panel:#1a2f3c; --line:#2f4a5b; --text:#e6efe9; --muted:#9bb2bc;
  --accent:#4fd1b5; --accent-ink:#0d1b22; --warn:#ff9a7a; --good:#8fd49a; --amber:#f2b84b;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;margin:0;overflow:hidden;overscroll-behavior:none;position:fixed;inset:0}
body{background:var(--bg);color:var(--text);font:400 16px/1.4 "DM Sans",system-ui,sans-serif;-webkit-text-size-adjust:100%;user-select:none;-webkit-user-select:none}
#app{position:absolute;inset:0;display:flex;flex-direction:column;max-width:640px;margin:0 auto;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);height:100%}
h1,h2{font-family:"Silkscreen","Courier New",monospace;font-weight:700;margin:0 0 8px;line-height:1.2}
h1{font-size:1.8rem} h2{font-size:1rem}
p{margin:0 0 8px}
.muted{color:var(--muted)} .small{font-size:.82rem}
.bad{color:var(--warn);font-weight:700} .good{color:var(--good);font-weight:700} .amber{color:var(--amber);font-weight:700}
#hud{flex:none;padding:5px 6px 4px}
.stats{display:grid;grid-template-columns:1.35fr .8fr 1fr .8fr;gap:4px;margin:0 0 4px}
.stats div{background:var(--panel);border:2px solid var(--line);padding:2px 5px;min-width:0}
.stats dt{font-size:.66rem;color:var(--muted);line-height:1.1;display:flex;align-items:center;gap:4px;white-space:nowrap}
.stats dt svg{display:block;flex:none}
#xbtn{position:sticky;top:0;display:block;margin:-4px -4px -36px auto;width:40px;height:40px;z-index:3;font:700 1.6rem/1 "DM Sans",system-ui,sans-serif;color:var(--text);background:var(--panel);border:2px solid var(--line);cursor:pointer;padding:0}
#xbtn[hidden]{display:none}
#text h2{padding-right:40px}
.stats dd{margin:1px 0 0;font:700 .64rem/1.2 "Silkscreen","Courier New",monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars{display:grid;grid-template-columns:1fr 1fr .8fr;gap:4px}
.bar{position:relative;height:16px;background:var(--panel);border:2px solid var(--line);overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);width:50%;opacity:.8}
.bar.heat i{background:var(--warn)}
.bar span{position:absolute;left:5px;top:0;font-size:.68rem;line-height:12px;font-weight:700;text-shadow:0 0 3px var(--panel)}
#stage{position:relative;flex:1;min-height:0;border-top:3px solid var(--line);border-bottom:3px solid var(--line);background:#2c5b78;overflow:hidden}
canvas#scene{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:none}
input.txt{display:block;width:100%;min-height:44px;margin:4px 0 8px;padding:8px 12px;font:700 1rem "DM Sans",system-ui,sans-serif;color:var(--text);background:var(--bg);border:2px solid var(--line);user-select:text;-webkit-user-select:text}
.look{display:flex;gap:12px;align-items:center;margin:4px 0 8px}
.look canvas{width:80px;height:96px;image-rendering:pixelated;background:var(--bg);border:2px solid var(--line);flex:none}
#note{white-space:pre-line;position:absolute;left:6px;right:6px;top:6px;pointer-events:none;font-size:.85rem;font-weight:700;color:#fff;text-shadow:0 1px 3px #000,0 0 6px #000}
#mission{position:absolute;left:6px;top:30px;max-width:80%;pointer-events:none;font-size:.78rem;font-weight:700;background:rgba(10,20,30,.78);color:#ffd88a;padding:2px 7px;border:1px solid #ffd88a}
#mission[hidden]{display:none}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:74%;overflow-y:auto;overscroll-behavior:contain;background:var(--panel);border-top:3px solid var(--accent);padding:12px 12px 14px;touch-action:pan-y}
#sheet[hidden]{display:none}
#actions{display:grid;gap:7px;margin-top:6px}
.btn{display:block;width:100%;min-height:46px;text-align:left;padding:8px 12px;font:700 .98rem "DM Sans",system-ui,sans-serif;color:var(--text);background:transparent;border:2px solid var(--accent);cursor:pointer}
.btn small{display:block;font-weight:400;font-size:.82rem;opacity:.85;line-height:1.25;margin-top:1px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.quiet{border-color:var(--line);color:var(--muted);font-weight:500}
.btn.warn{border-color:var(--warn);color:var(--warn)}
.btn:disabled{opacity:.4;cursor:default}
button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;margin:4px 0 8px}
.kv div{border-bottom:1px solid var(--line);padding:2px 0;display:flex;justify-content:space-between;gap:8px}
.meter{height:10px;background:var(--bg);border:2px solid var(--line);margin:3px 0 8px}
.meter i{display:block;height:100%;background:var(--accent)}
#bar{flex:none;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:5px 6px}
#bar[hidden]{display:none}
#bar button{min-height:44px;font:700 .72rem "Silkscreen","Courier New",monospace;color:var(--text);background:var(--panel);border:2px solid var(--line);cursor:pointer;padding:0 2px}
#bar button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <header id="hud" hidden>
    <dl class="stats">
      <div><dt><span id="h-ico"></span><span id="h-day">Day 1</span></dt><dd id="h-time"></dd></div>

    <div id="note" aria-live="polite"></div>
    <div id="mission" hidden></div>
    <section id="sheet" hidden aria-live="polite"><button type="button" id="xbtn" aria-label="Close">&times;</button><div id="text"></div><div id="actions"></div></section>
  </div>
  <nav id="bar" hidden>
    <button type="button" id="b-bag">Bag</button>
    <button type="button" id="b-build">Build</button>
    <button type="button" id="b-biz">Biz</button>
    <button type="button" id="b-phone">Phone</button>
    <button type="button" id="b-go">Go</button>
  </nav>
</div>

<script>
(()=>{

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const district=(x,y)=>x<10?'Greenbelt':x>=41?(y<22?'Neon Mile':'Foundry Row'):y<12?'Highline':(y>=28||(x>=31&&y>=23))?'Dockside':'Grid';
const isWater=(x,y)=>x>=61||y>=34||(x>=41&&x<=44);
const map=Array.from({length:H},(_,y)=>Array.from({length:W},(_,x)=>{
  if(isWater(x,y))return T.WATER;

[17,27].forEach(y=>{for(let x=0;x<10;x++)map[y][x]=T.ROAD});
const FARM_TILES=[];
[19,21].forEach(y=>{for(let x=2;x<=7;x++){map[y][x]=T.FARM;FARM_TILES.push([x,y])}});

function fill(x,y,t){for(let j=0;j<4;j++)for(let i=0;i<4;i++)map[y+j][x+i]=t}

 '1,0':['estate','Ashgrove Estate'],'2,0':['bank','Marrow Bank'],'3,1':['club','The Gilded Tide'],'0,1':['flats','Terrace Flats'],

[0,1,2,3,4,5,7,8,9].forEach(cx=>{for(let cy=0;cy<6;cy++){
  const bx=11+5*cx,by=3+5*cy,s=SPEC[cx+','+cy],d=district(bx+1,by+1);

    if(s[0]==='plaza')fill(bx,by,T.PLAZA);
    else if(s[0]==='lot')fill(bx,by,T.LOT);
    else addPOI(s[0],s[1],s[0],bx,by);
  }else if(cx<=5&&cy<=1&&(cx+cy)%3===0)fill(bx,by,T.PARK);
  else{blocks.push({x:bx,y:by,kind:(d==='Dockside'||d==='Foundry Row')?'warehouse':'tower',poi:null,key:bx+','+by});fill(bx,by,T.BLD)}
}});
addPOI('barn','Briar Barn','barn',2,11);
[[4,3],[4,28]].forEach(([x,y])=>{blocks.push({x,y,kind:'farmstead',poi:null,key:x+','+y});fill(x,y,T.BLD)});
POIS.plaza={id:'plaza',name:'Central Plaza',kind:'plaza',d:'Grid',ex:22,ey:15};
const blockByKey=k=>blocks.find(b=>b.key===k);
const STOPS=[
 {id:0,name:'Greenbelt Gate',x:9,y:17},{id:1,name:'Terrace Lift',x:20,y:7},{id:2,name:'Central Station',x:20,y:17},
 {id:3,name:'Dockside Stop',x:35,y:27},{id:4,name:'Neon Mile Stop',x:50,y:17},{id:5,name:'Foundry Stop',x:50,y:27}
];

const pass=(x,y)=>x>=0&&y>=0&&x<W&&y<H&&PASSABLE.has(map[y][x]);
function bfs(sx,sy,tx,ty){
  if(!pass(tx,ty)||!pass(sx,sy))return null;
  if(sx===tx&&sy===ty)return [];
  const prev=new Int32Array(W*H).fill(-1),s=sy*W+sx,g=ty*W+tx;
  prev[s]=s;const q=[s];
  for(let i=0;i<q.length;i++){
    const c=q[i];if(c===g)break;
    const cx=c%W,cy=(c/W)|0;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=cx+dx,ny=cy+dy;
      if(!pass(nx,ny))continue;
      const n=ny*W+nx;if(prev[n]!==-1)continue;
      prev[n]=c;q.push(n);
    }
  }
  if(prev[g]===-1)return null;
  const path=[];let c=g;
  while(c!==s){path.push([c%W,(c/W)|0]);c=prev[c]}
  return path.reverse();
}
function spotNear(poi,id){
  const c=[];
  for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){
    if(Math.abs(dx)+Math.abs(dy)>2)continue;
    const x=poi.ex+dx,y=poi.ey+dy;
    if(pass(x,y)&&map[y][x]!==T.FARM)c.push([x,y]);
  }
  let h=0;for(const ch of id)h=(h*31+ch.charCodeAt(0))>>>0;
  return c[h%c.length];
}

 rental:{n:'Apartments',fit:900,sign:'FLATS',col:['#c9a58c','#97765f'],d:'Tenants pay rent every day. Occupancy follows your standing.'},

/* ================= STATE ================= */
let G=null,modal=false,dismissable=true,placing=null;
const day=()=>Math.floor(G.t/1440)+1;
const hourOf=()=>Math.floor(G.t/60)%24;
const isNight=()=>{const h=hourOf();return h>=21||h<5};
const clockNow=()=>G?G.t:600+performance.now()/40;
const tideV=(t=clockNow())=>Math.sin(2*Math.PI*t/(12.4*60));
const tideName=(t=clockNow())=>{const v=tideV(t);return v>.45?'high':v<-.45?'low':(Math.cos(2*Math.PI*t/(12.4*60))>0?'rising':'falling')};
const npcS=n=>G.npcs[n.id];
const known=type=>{const r=G.rumors.find(r=>r.type===type);return r?r.knows.length:0};

function tagsNow(){
  const t=[...BG[G.bg].tags];
  if(G.debt>0||G.arrears>0)t.push('in-debt');

  if(G.structs.some(s=>s.type==='stall')||G.biz.some(b=>b.type&&b.type!=='home'&&b.type!=='rental'))t.push('shopkeeper');
  if(G.structs.length||G.biz.length||Object.keys(G.owned).length)t.push('landowner');
  if(G.biz.some(b=>b.workers.length))t.push('employer');
  if(known('generous')>=3)t.push('local-hero');
  if(G.quirk)t.push(G.quirk);
  return t;
}
const has=t=>tagsNow().includes(t);
const rumorDelta=n=>G.rumors.reduce((s,r)=>s+(r.knows.includes(n.id)?RUM[r.type].d*r.str/100:0),0);
const att=n=>{let a=0;for(const t of tagsNow())a+=n.aff[t]||0;return a+G.rep[n.d]*.35+npcS(n).m+rumorDelta(n)};
const tier=a=>a<-30?0:a<0?1:a<30?2:3;
const LAB=['hostile','cold','neutral','warm'];
const buyF=n=>[9,1.2,1,.9][tier(att(n))]*(has('smooth')?.92:1)*(G.quirk==='frugal'?.95:1);
const sellF=n=>[0,.85,1,1.1][tier(att(n))]*(G.quirk==='frugal'?.95:1);
const payF=n=>[0,.85,1,1.15][tier(att(n))];
const standing=v=>v<-30?'despised':v<-10?'distrusted':v<10?'unknown':v<30?'respected':'admired';
const isOpen=id=>{if(G.mod&&G.mod.closed.includes(id))return false;const o=OPEN[id];if(!o)return true;const h=hourOf();return(h>=o[0]&&h<o[1])||h<o[1]-24};
const fmtHr=h=>{h%=24;return (h%12||12)+(h<12?' am':' pm')};
const mealPrice=()=>Math.round(9*(1+Math.min(.6,G.demand*.05))*G.mod.meal);
const fishMod=()=>clamp(1+(50-G.fishStock)/80,.6,1.8)*G.mod.fish;
const scrapMod=()=>clamp(1+(60-G.flats)/60,.7,2);
const structAt=(x,y)=>G.structs.find(s=>s.x===x&&s.y===y);
const signNear=st=>G.structs.some(s=>s.type==='sign'&&Math.hypot(s.x-st.x,s.y-st.y)<=5);
let noteTimer=null;
function notify(m,sticky){const e=$('#note');e.textContent=m;clearTimeout(noteTimer);if(!sticky)noteTimer=setTimeout(()=>e.textContent='',7000)}
function addRumor(type,ids){
  let r=G.rumors.find(x=>x.type===type);
  if(r){r.str=100;ids.forEach(i=>{if(!r.knows.includes(i))r.knows.push(i)})}
  else G.rumors.push({type,str:100,knows:[...ids]});
}
function projPct(p){const d=PROJECTS.find(x=>x.id===p.id),k=Object.keys(d.need);return Math.round(k.reduce((s,x)=>s+Math.min(1,(p.have[x]||0)/d.need[x]),0)/k.length*100)}
function checkProject(p){
  const d=PROJECTS.find(x=>x.id===p.id);
  if(!p.done&&Object.keys(d.need).every(k=>(p.have[k]||0)>=d.need[k])){p.done=true;G.fx[p.id]=true;notify(`Project complete: ${d.name}. ${d.desc}`);news(`Project complete: ${d.name}. ${d.desc}`,3);return true}
  return false;
}
/* homes */
function homePoi(){
  const h=G.home;
  if(h.startsWith('S:')){const s=G.structs.find(x=>'S:'+x.id===h);if(s)return{id:h,name:'Your house',ex:s.x,ey:s.y,d:district(s.x,s.y)}}
  if(h.startsWith('B:')){const b=blockByKey(h.slice(2));if(b)return{id:h,name:'Your building',ex:b.x+1,ey:b.y+4,d:district(b.x+1,b.y+1)}}
  return POIS[POIS[h]?h:'barn'];
}
function homeBill(){
  const h=G.home;
  if(h.startsWith('S:'))return 35;
  if(h.startsWith('B:'))return 60;
  return G.owned[h]?Math.round(RENT[h]*.3):RENT[h];
}
function monthlyBills(){
  const lines=[];
  lines.push(['Home',homeBill()]);
  Object.keys(G.owned).forEach(id=>{if(G.home!==id)lines.push([POIS[id].name+' upkeep',Math.round(RENT[id]*.3)])});
  G.structs.forEach(s=>{if(s.type==='house'&&G.home!=='S:'+s.id)lines.push(['House upkeep',35])});
  Object.keys(G.veh.owned).forEach(k=>{if(G.veh.owned[k]&&!G.veh.stolen[k]&&VEH[k].ins)lines.push([VEH[k].n+' insurance',VEH[k].ins])});
  G.biz.forEach(b=>{if(G.home==='B:'+b.key)return;lines.push(['Property tax',Math.round(b.price*.01)]);if(b.type&&b.type!=='home')lines.push(['Business license',20])});
  return lines;
}
function chargeBills(){
  const lines=monthlyBills(),total=Math.round(lines.reduce((s,l)=>s+l[1],0)*G.mod.bills);
  const paid=Math.min(G.cash,total);G.cash-=paid;G.arrears+=total-paid;G.lastBills=total;
  notify(total-paid>0?`Monthly bills ${money(total)}. You came up ${money(total-paid)} short.`:`Monthly bills paid: ${money(total)}.`);
  quip(total-paid>0?'bill_short':'bill');
}

/* ================= BUSINESS ================= */
function makePool(){G.pool=Array.from({length:4},()=>{const skill=ri(1,3);return{id:Math.random().toString(36).slice(2,8),name:pick(WN)+' '+pick(LN),skill,wage:[0,16,24,34][skill]+ri(-2,3),trait:pick(TRAITS)}})}
function payOut(b,amt){
  const fromTill=Math.min(b.till,amt);b.till-=fromTill;let rest=amt-fromTill;
  const fromCash=Math.min(G.cash,rest);G.cash-=fromCash;rest-=fromCash;
  return rest<=0;
}
function runBiz(b){
  const t=BT[b.type];if(!t)return;
  const dist=b.d,rep=G.rep[dist];
  let appeal=clamp(1+rep/100,.4,1.5)*(1+.25*(b.level-1));
  if(known('thief')>=3)appeal*=.8;
  if(known('successful'))appeal*=1.08;
  b.workers.forEach(w=>{if(w.trait==='charming')appeal*=1.1});
  if(G.ev&&G.ev.id==='gala'&&dist==='Highline')appeal*=1.3;
  if(G.ev&&G.ev.id==='strike'&&dist==='Dockside')appeal*=.75;
  appeal*=(G.mod.traffic[dist]||1);
  const r={units:0,rev:0,cost:0,wages:0,theft:0,note:''};
  const wcap=b.workers.reduce((s,w)=>s+(4+w.skill*3)*(w.trait==='quick'?1.3:1),0);
  if(b.type==='rental'){
    const units=4+2*(b.level-1),occ=clamp(.5+rep/200+.06*b.level,.35,1);
    r.rev=Math.round(units*8*occ);r.units=units;b.till+=r.rev;
  }else if(b.type==='farm'){
    const f=dist==='Greenbelt'?1:.5,crops=Math.round((3+wcap)*f*rnd(.8,1.1)*G.mod.yield);
    r.units=crops;r.cost=Math.round(crops*1.5);payOut(b,r.cost);
    if(b.auto){r.rev=crops*4;b.till+=r.rev}else b.store+=crops;
  }else if(b.type!=='home'){
    const cap=Math.round((3+wcap)*(t.cap/7)),dem=TR[dist]*t.per*appeal*[1.3,1,.65][b.mk]*rnd(.85,1.15);
    const units=Math.floor(Math.min(dem,cap)),used=Math.min(b.supplies,units),buy=units-used;
    b.supplies-=used;r.units=units;r.rev=Math.round(units*t.price*MK[b.mk]);b.till+=r.rev;
    r.cost=Math.round(buy*t.cost);if(r.cost)payOut(b,r.cost);
    const sticky=b.workers.filter(w=>w.trait==='sticky').length,guard=b.workers.some(w=>w.trait==='guard');
    if(sticky&&!guard){r.theft=Math.min(b.till,Math.round(r.rev*.08*sticky));b.till-=r.theft}
  }
  b.workers=b.workers.filter(w=>{
    const ok=payOut(b,w.wage);
    if(ok){r.wages+=w.wage;return true}
    notify(`${w.name} quit. Wages went unpaid.`);return false;
  });
  if(b.till>150&&Math.random()<.07*(b.workers.some(w=>w.trait==='guard')?.3:1)){const loss=Math.round(b.till*.5);b.till-=loss;r.note=`Robbed. ${money(loss)} taken.`;{notify(`Break-in at your ${t.n.toLowerCase()}. ${money(loss)} gone.`);news(`A ${t.n.toLowerCase()} in the ${dist} was broken into.`,2)}}
  r.profit=r.rev-r.cost-r.wages-r.theft;b.last=r;
}

/* ================= TIME, NEEDS, ECONOMY ================= */
function needs(m,sleep){
  const h=m/60,k=((G.ev&&G.ev.id==='heat')?1.3:1)*G.mod.drain,hr=hourOf(),q=G.quirk;
  let ek=1,hk=1;
  if(q==='night-owl')ek=isNight()?.7:(hr>=5&&hr<10?1.2:1);
  else if(q==='early-bird')ek=(hr>=6&&hr<18)?.85:1.3;
  else if(q==='iron-stomach')hk=.8;
  G.hunger-=h*(sleep?1.2:2.2)*k*hk;
  if(!sleep)G.energy-=h*2.5*k*ek;
  G.hunger=clamp(G.hunger,0,100);G.energy=clamp(G.energy,0,100);
}
function advance(m,sleep,quiet){
  const b=G.t;needs(m,sleep);G.t+=m;
  const d0=Math.floor(b/1440),d1=Math.floor(G.t/1440);
  for(let d=d0+1;d<=d1;d++)newDay(d);
  const h0=Math.floor(b/60),h1=Math.floor(G.t/60);
  for(let h=h0+1;h<=h1&&h<=h0+30;h++)hourly(h);
  if(m>=60)syncNPCs();else if(h1>h0)NPCS.forEach(n=>{if(!(n.id==='reyes'&&n.chasing))assign(n,false)});
  if(!quiet)hud();
}
function newDay(d){
  G.ev=Math.random()<.5?null:pick(EVENTS);
  dayNews();
  if(d%30===0)chargeBills();
  G.plots.forEach(p=>{if(p.s===1){p.d--;if(p.d<=0)p.s=2}});
  G.structs.forEach(s=>{if(s.type==='planter'&&s.s===1){s.d--;if(s.d<=0)s.s=2}});
  G.biz.forEach(runBiz);
  makePool();
  if(G.debt>0&&day()-G.loanDay>(G.loanTerm||10)&&!G.flags.defRum){G.flags.defRum=1;addRumor('defaulter',['cordelia'])}
  G.rumors.forEach(r=>r.str-=4);G.rumors=G.rumors.filter(r=>r.str>=12);
  cityDaily();threadsDaily();
  G.projects.forEach(p=>{
    if(p.done)return;const d=PROJECTS.find(x=>x.id===p.id);
    NPCS.filter(n=>n.d===d.d).forEach(n=>{
      const s=npcS(n);if(s.cash<40||Math.random()>.35)return;
      const k=Object.keys(d.need).find(k=>(p.have[k]||0)<d.need[k]);if(!k)return;
      const amt=k==='cash'?8:Math.max(1,Math.round(d.need[k]*.04));
      p.have[k]=Math.min(d.need[k],(p.have[k]||0)+amt);s.cash-=k==='cash'?8:5;
    });
    checkProject(p);
  });
  if(G.ev)notify(`News: ${G.ev.name}. ${G.ev.desc}`);
  save();
}
function npcEat(n,s){
  const pm=mealPrice(),tr=tier(att(n)),pat=n.d==='Highline'?1.15:1;
  let best=null;
  G.structs.forEach(st=>{
    if(st.type!=='stall')return;
    const rng=signNear(st)?26:13;if(Math.hypot(st.x-n.x,st.y-n.y)>rng)return;
    ['meals','smoked','fish','crops'].forEach(k=>{
      if(!(st.stock[k]>0))return;
      const pr=Math.round(FAIR[k]*MK[st.mk]),max=FAIR[k]*(.95+.12*tr)*pat;
      if(tr<1||pr>max||pr>s.cash)return;
      const eff=pr/HUNG[k];if(!best||eff<best.eff)best={st,k,pr,eff};
    });
  });
  if(best&&(best.eff<=pm/45*1.15||tr>=2)){
    best.st.stock[best.k]--;best.st.stored+=best.pr;best.st.earned+=best.pr;
    s.cash-=best.pr;s.hunger=Math.min(100,s.hunger+HUNG[best.k]);
    if(best.st.earned>=100&&!G.flags.succRum){G.flags.succRum=1;addRumor('successful',[n.id])}
  }else if(s.cash>=pm){s.cash-=pm;s.hunger=Math.min(100,s.hunger+45);G.demand+=1}
  else if(s.cash>=5){s.cash-=5;s.hunger=Math.min(100,s.hunger+15)}
}
function npcBuyTrinket(n,s){
  const tr=tier(att(n));if(tr<1)return;
  const st=G.structs.find(x=>x.type==='stall'&&x.stock.trinkets>0&&Math.hypot(x.x-n.x,x.y-n.y)<=(signNear(x)?26:13));
  if(!st)return;
  const pr=Math.round(FAIR.trinkets*MK[st.mk]);
  if(pr>FAIR.trinkets*(.95+.12*tr)*1.15||pr>s.cash)return;
  st.stock.trinkets--;st.stored+=pr;st.earned+=pr;s.cash-=pr;
}
function hourly(h){
  const hr=h%24,t=h*60,high=tideV(t)>.45,low=tideV(t)<-.45;
  G.fishStock=clamp(G.fishStock+(high?2.5:1.2),0,100);
  G.flats=clamp(G.flats+(high?1.5:.3),0,100);
  G.demand=Math.max(0,G.demand-.6);
  const R=NPC.reyes,rn=Math.hypot(R.x-G.p.x,R.y-G.p.y)<9&&!R.indoors;
  const atHome=Math.hypot(homePoi().ex-G.p.x,homePoi().ey-G.p.y)<2.5;
  G.heat=Math.max(0,G.heat-(atHome?.7:rn?0:.2)*(G.mod.cops?.4:1)*flackHeatMul());
  const out=NPCS.filter(n=>!n.indoors);
  for(let i=0;i<out.length;i++)for(let j=i+1;j<out.length;j++){
    const a=out[i],b=out[j];if(Math.hypot(a.x-b.x,a.y-b.y)>3.5)continue;
    G.rumors.forEach(r=>{const ka=r.knows.includes(a.id),kb=r.knows.includes(b.id);if(ka!==kb&&Math.random()<.45)r.knows.push(ka?b.id:a.id)});
  }
  const strike=G.ev&&G.ev.id==='strike';
  NPCS.forEach(n=>{
    const s=npcS(n);
    if(hr>=22||hr<7)s.hunger=Math.min(100,s.hunger+2);else s.hunger=Math.max(0,s.hunger-4.5);
    if(hr===17&&n.act!=='home'&&!(strike&&n.d==='Dockside'&&n.id!=='duarte'))s.cash+=n.wage;
    if(n.indoors)return;
    if(n.d==='Dockside'&&n.act==='hang'&&high&&G.fishStock>5){G.fishStock-=4;s.cash+=4}
    if(n.id==='pip'&&low&&G.flats>8){G.flats-=6;s.cash+=5}
    if(s.hunger<45)npcEat(n,s);
    if(n.wants==='trinkets'&&s.cash>60&&Math.random()<.05)npcBuyTrinket(n,s);
  });
  if(G.fishStock<25&&!G.flags.fishNews){G.flags.fishNews=1;alertNews('News: Fish are getting scarce. Prices are climbing.')}
  if(G.fishStock>45)G.flags.fishNews=0;
  if(G.flats<20&&!G.flags.flatNews){G.flags.flatNews=1;alertNews('News: The mudflats have been picked clean. Scrap is in demand.')}
  if(G.flats>45)G.flags.flatNews=0;
  if(G.demand>=8&&!G.flags.rushNews){G.flags.rushNews=1;alertNews('News: The diner is slammed. Meals cost more.')}
  if(G.demand<3)G.flags.rushNews=0;
  threadsHourly();
}

function actFor(n){
  const h=hourOf();
  let a=(h>=22||h<7)?'home':h<17?'work':'hang';
  if(a==='work'&&G.ev&&G.ev.id==='strike'&&n.d==='Dockside'&&n.id!=='duarte')a='hang';
  return a;
}
function goto(n,s){n.path=bfs(Math.round(n.x),Math.round(n.y),s[0],s[1])||[]}
function assign(n,instant){
  const a=actFor(n);n.act=a;
  const homeP=POIS[n.home];
  if(a==='home'){
    if(instant){n.indoors=true;n.path=[];n.x=homeP.ex;n.y=homeP.ey}
    else if(!n.indoors){goto(n,[homeP.ex,homeP.ey]);n.goHome=true}
  }else{
    const s=spotNear(POIS[a==='work'?n.work:n.hang],n.id);
    if(instant){n.indoors=false;n.x=s[0];n.y=s[1];n.path=[]}
    else{
      if(n.indoors){n.indoors=false;n.x=homeP.ex;n.y=homeP.ey}
      goto(n,s);n.goHome=false;
    }
  }
}
function syncNPCs(){NPCS.forEach(n=>{if(n.id==='reyes'&&n.chasing)return;assign(n,true)})}
function initNPCs(){NPCS.forEach(n=>{n.x=0;n.y=0;n.path=[];n.indoors=true;n.goHome=false;n.act='home';n.chasing=false;n.rt=0});syncNPCs()}
function moveEnt(e,dt,sp){
  if(!e.path||!e.path.length)return false;
  const [nx,ny]=e.path[0],dx=nx-e.x,dy=ny-e.y,d=Math.hypot(dx,dy),st=sp*dt;
  if(d<=st){e.x=nx;e.y=ny;e.path.shift()}
  else{e.x+=dx/d*st;e.y+=dy/d*st}
  if(Math.abs(dx)>.01)e.face=dx>0?1:-1;
  return true;
}

function worldLines(){
  const r=[];
  if(G.ev)r.push(`${G.ev.name}: ${G.ev.desc}`);
  if(G.fishStock<30)r.push('Fish are scarce. Too many lines in the water.');
  if(G.fishStock>70)r.push('The fish are running thick.');
  if(G.flats<30)r.push('The flats are picked clean. Scrap is hard to find.');
  if(G.demand>=6)r.push('The diner is slammed. Meals cost more.');
  const open=G.projects.filter(p=>!p.done);
  if(open.length){const p=pick(open),d=PROJECTS.find(x=>x.id===p.id);r.push(`${d.name} is ${projPct(p)}% funded.`)}
  r.push(pick(TIPS));
  return r;
}
function pickpocket(n){
  let c=.42+(G.quirk==='light-fingered'?.1:0)+(has('creative')?.08:0)+(has('outsider')?.06:0)+(G.fx.kit?.12:0)-G.heat*.05-(n.id==='reyes'?.3:0)+G.mod.heist*.5;
  advance(5);
  if(Math.random()<c){
    quip('steal');const amt=ri(8,40);G.cash+=amt;let m=`You lift ${money(amt)} without a sound.`;
    if(Math.random()<.25){G.inv.loot++;m+=' And a watch worth fencing.'}
    talk(n,m);
  }else{
    npcS(n).m-=25;addRumor('thief',[n.id]);G.heat=Math.min(5,G.heat+(n.id==='reyes'?3:1.5));
    notify('You were seen. Police will be looking for you.');talk(n,`${n.name} grabs your wrist. "Hey!"`);
  }
}
function talk(n,extra){
  if(!G.met[n.id])G.met[n.id]=day();
  const a=att(n),tr=tier(a),tg=tagsNow(),s=npcS(n);
  let best=null,bv=-1;
  tg.forEach(t=>{if(n.react[t]&&Math.abs(n.aff[t]||0)>=bv){bv=Math.abs(n.aff[t]||0);best=t}});
  const why=tg.filter(t=>n.aff[t]);
  const heard=G.rumors.filter(r=>r.knows.includes(n.id)).map(r=>RUM[r.type].t);
  const needsL=[];if(s.hunger<40)needsL.push('hungry');if(s.cash<15)needsL.push('short on cash');
  const cls=tr>=3?'good':tr===0?'bad':tr===1?'amber':'';
  const shop=Object.keys(OWNER).find(k=>OWNER[k]===n.id);
  const btns=[
    {label:'Chat',sub:s.chat===day()?'You already chatted today':'Small talk builds trust',off:s.chat===day()||tr===0,
     fn:()=>{s.chat=day();s.m+=3;advance(G.quirk==='neighborly'?25:10);talk(n,n.topic)}},
    {label:'Ask about town',sub:tr>=2?'Rumors and tips':'They will not talk about that yet',off:tr<2,fn:()=>{advance(5);talk(n,`"${pick(worldLines())}"`)}},
    {label:'Give a meal',sub:G.inv.meals>0?`You have ${G.inv.meals}`:'You have none',off:G.inv.meals<1,cls:'',fn:()=>{
      const nb=G.quirk==='neighborly';G.inv.meals--;s.m+=nb?15:12;s.hunger=Math.min(100,s.hunger+45);G.rep[n.d]=clamp(G.rep[n.d]+(nb?3:2),-100,100);G.gifts++;
      if(G.gifts===3||G.gifts%5===0)addRumor('generous',[n.id]);
      talk(n,`${n.name} accepts the meal, surprised.`)}}
  ];
  if(shop)btns.push({label:`Visit ${POIS[shop].name}`,cls:'',fn:()=>goPOI(POIS[shop])});
  btns.push({label:'Pickpocket',sub:'Risky. Raises your wanted level if caught.',cls:'quiet',fn:()=>pickpocket(n)});
  btns.push(leaveBtn);
  ui(`<h2>${esc(n.name)}</h2><p class="muted">${esc(n.role)}, ${n.d}. Attitude: <span class="${cls}">${LAB[tr]}</span>${needsL.length?`. Seems ${needsL.join(' and ')}.`:'.'}</p>
  <p>${esc(n.tier[tr])}</p>${best?`<p>${esc(n.react[best])}</p>`:''}${heard.length?`<p class="amber">${esc(n.name.split(' ')[0])} has heard: ${esc(heard[0])}</p>`:''}${extra?`<p class="amber">${esc(extra)}</p>`:''}
  ${why.length?`<p class="muted small">Shaped by: ${why.map(esc).join(', ')}.</p>`:''}`,btns);
}

      {label:'Sell it back',sub:`Get ${money(biz.price*.7)}`,cls:'quiet',fn:()=>sellBiz(biz)},{label:'Close',cls:'quiet',fn:closeMenu}]);
  }

  if(biz.type==='home'){
    const hp={id:'B:'+biz.key,name:'Your building'};
    return ui(`<h2>${t.n}</h2><p class="muted">${biz.d}. ${t.d}</p>${msgP(msg)}`,[
      G.home==='B:'+biz.key?{label:'Sleep, cook, rest',fn:()=>homeMenu(homePoi())}:{label:'Make this my home',fn:()=>{G.home='B:'+biz.key;bizMenu(biz,'You moved in.')}},
      {label:'Sell the building',sub:`Get ${money((biz.paid||biz.price)*.7)}`,cls:'quiet',fn:()=>sellBiz(biz)},leaveBtn]);
  }
  btns.push({label:'Collect till',sub:money(biz.till),off:biz.till<=0,fn:()=>{G.cash+=biz.till;biz.till=0;advance(5);bizMenu(biz,'Cash collected.')}});
  if(t.dep)btns.push({label:'Add supplies',sub:`In stock: ${biz.supplies}. Use your own goods to save money.`,cls:'',fn:()=>depositMenu(biz)});
  if(biz.type==='farm'){
    btns.push({label:`Auto-sell crops: ${biz.auto?'On':'Off'}`,sub:biz.auto?'Sells wholesale at $4 each':'Crops pile up for you to collect',cls:'',fn:()=>{biz.auto=!biz.auto;bizMenu(biz)}});
    btns.push({label:'Take stored crops',sub:`${biz.store} waiting`,off:biz.store<=0,cls:'',fn:()=>{G.inv.crops+=biz.store;biz.store=0;bizMenu(biz,'Crops added to your bag.')}});
  }
  if(biz.type!=='rental')btns.push({label:`Staff (${biz.workers.length}/${1+biz.level})`,sub:'Hire and fire',cls:'',fn:()=>staffMenu(biz)});
  if(biz.type==='cafe'||biz.type==='bar'||biz.type==='workshop')btns.push({label:`Price: ${MKN[biz.mk]}`,sub:'Low sells more, High sells less',cls:'',fn:()=>{biz.mk=(biz.mk+1)%3;bizMenu(biz)}});
  if(biz.level<3)btns.push({label:`Upgrade to level ${biz.level+1}`,sub:`${money(700*biz.level)}. More demand and room for staff.`,off:G.cash<700*biz.level,cls:'',fn:()=>ask(`Upgrade to level ${biz.level+1}?`,`It costs ${money(700*biz.level)}.`,'Yes, upgrade',()=>{G.cash-=700*biz.level;biz.paid=(biz.paid||biz.price)+700*biz.level;biz.level++;bizMenu(biz,'Upgraded.')},()=>bizMenu(biz))});
  btns.push({label:'Sell the building',sub:`Get ${money((biz.paid||biz.price)*.7)}`,cls:'quiet',fn:()=>sellBiz(biz)},leaveBtn);
  ui(`<h2>${t.n}, level ${biz.level}</h2><p class="muted">${biz.d}. ${t.d}</p>${msgP(msg)}
  <div class="kv"><div><span>Till</span><b>${money(biz.till)}</b></div><div><span>Supplies</span><b>${biz.supplies}</b></div><div><span>Staff</span><b>${biz.workers.length}</b></div>
  ${L?`<div><span>Last day</span><b>${L.profit>=0?'+':''}${money(L.profit)}</b></div><div><span>Sold</span><b>${L.units}</b></div><div><span>Wages</span><b>${money(L.wages)}</b></div>`:''}</div>${L&&L.theft?`<p class="bad small">Staff skimmed ${money(L.theft)}.</p>`:''}${L&&L.note?`<p class="bad small">${esc(L.note)}</p>`:''}`,btns);
}

function missionTick(){
  const m=G.mission;if(!m)return;
  if(G.t>m.deadline){G.mission=null;notify(`Job failed: ${m.title}. Out of time.`);G.rep['Neon Mile']=clamp(G.rep['Neon Mile']-3,-100,100);return}
  const poi=POIS[m.stops[m.i]];
  if(Math.hypot(G.p.x-poi.ex,G.p.y-poi.ey)>1.3)return;
  if(m.night&&!isNight())return;
  m.i++;
  if(m.i<m.stops.length){notify(`Package picked up. Deliver it to ${POIS[m.stops[m.i]].name}.`);return}
  G.mission=null;const vex=npcS(NPC.vex);
  if(m.type==='courier'){G.cash+=m.reward;vex.m+=5;G.rep['Neon Mile']=clamp(G.rep['Neon Mile']+3,-100,100);notify(`Delivered. You earn ${money(m.reward)}.`);quip('job')}
  else if(m.type==='collect'){
    if(Math.random()<.7){G.cash+=m.reward;G.heat=Math.min(5,G.heat+1);vex.m+=6;G.rep[poi.d]=clamp(G.rep[poi.d]-6,-100,100);const o=OWNER[poi.id]&&NPC[OWNER[poi.id]];if(o)npcS(o).m-=15;{news(`Shakedown reported at ${poi.name}.`,2);notify(`They pay up. You earn ${money(m.reward)}, and made an enemy.`)}}
    else{G.heat=Math.min(5,G.heat+2.2);notify('They call the police. Run!')}
  }else if(m.type==='heist'){
    if(Math.random()<m.odds){const c=ri(180,320);G.cash+=c;G.inv.loot+=ri(1,3);G.heat=Math.min(5,G.heat+2);vex.m+=10;{news(`Overnight break-in at ${poi.name}. Police are investigating.`,3);notify(`You are in and out. ${money(c)} and some goods. Police are alerted.`)}}
    else{G.heat=Math.min(5,G.heat+3.5);news(`Alarm at ${poi.name}: an attempted break-in.`,3);notify('Alarm! You bolt with nothing. Run!')}
  }else if(m.type==='boost'){
    if(Math.random()<m.odds){G.veh.owned.sedan=true;G.veh.stolen.sedan=true;G.veh.fuel.sedan=60;G.veh.active='sedan';G.heat=Math.min(5,G.heat+2);{news(`A sedan was stolen near ${poi.name}.`,2);notify('Hotwired. The sedan is yours, but it is hot.')}}
    else{G.heat=Math.min(5,G.heat+3);notify('The owner spots you. Run!')}
  }
  hud();
}

     {label:'Close',cls:'quiet',fn:closeMenu}]);

function canBuild(tx,ty){
  if(!G||tx<0||ty<0||tx>=W||ty>=H)return false;
  const t=map[ty][tx];
  if(t!==T.GRASS&&t!==T.LOT&&t!==T.PARK)return false;
  if(structAt(tx,ty))return false;
  if(Object.values(POIS).some(p=>p.ex===tx&&p.ey===ty))return false;
  if(blocks.some(b=>!b.poi&&b.x+1===tx&&b.y+4===ty))return false;
  return Math.hypot(tx-G.p.x,ty-G.p.y)<=9;
}
function tryPlace(tx,ty){
  if(!canBuild(tx,ty))return notify('You cannot build there. Try an open highlighted tile nearby.');
  const d=district(tx,ty),cost=buildCost(placing,d);
  if(G.cash<cost)return notify(`You need ${money(cost)} to build that in ${d}.`);
  G.cash-=cost;
  const st={id:Date.now()+Math.random(),type:placing,x:tx,y:ty,paid:cost};
  if(placing==='stall'){st.stock={meals:0,smoked:0,fish:0,crops:0,trinkets:0};st.mk=1;st.stored=0;st.earned=0}
  if(placing==='planter'){st.s=0;st.d=0}
  G.structs.push(st);
  const nm=STRUCTS[placing].n;placing=null;advance(60);G.energy=clamp(G.energy-5,0,100);
  notify(`${nm} built in ${d} for ${money(cost)}.`);hud();save();
}

function setBridge(closed){
  [17,27].forEach(y=>{for(let x=41;x<=44;x++)map[y][x]=closed?T.WATER:T.ROAD});
  if(closed&&G){
    const fix=e=>{if(e.x>=40.6&&e.x<=44.4&&(Math.abs(e.y-17)<1.6||Math.abs(e.y-27)<1.6)){e.x=e.x<42.5?40:45;e.y=Math.round(e.y)}};
    fix(G.p);G.p.path=[];NPCS.forEach(n=>{fix(n);n.path=[]});
  }
}
function applyBridge(c){if(c===bridgeOn)return;bridgeOn=c;setBridge(c)}
function recomputeMods(){
  const m={traffic:{},sell:1,crops:1,meal:1,fish:1,drain:1,vspeed:1,flood:[],tram:false,closed:[],cops:false,heist:0,bills:1,growth:0,yield:1,bridge:false,busk:1,names:{}};
  G.evs.forEach(e=>{
    const x=e.mod||{};
    for(const k in x){
      if(k==='traffic'){for(const d in x.traffic)m.traffic[d]=(m.traffic[d]||1)*x.traffic[d]}
      else if(['sell','crops','meal','fish','drain','vspeed','bills','yield','busk'].includes(k))m[k]*=x[k];
      else if(k==='heist'||k==='growth')m[k]+=x[k];
      else if(k==='flood'||k==='closed'){x[k].forEach(v=>{if(!m[k].includes(v))m[k].push(v);if(k==='closed')m.names[v]=e.name})}
      else if(x[k]===true)m[k]=true;
    }
  });
  G.mod=m;applyBridge(m.bridge);
}
function startEvent(t){
  const o=t.mk(),dur=ri(t.dur[0],t.dur[1]);
  G.evs.push({id:t.id,sev:t.sev,name:o.name,desc:o.desc,mod:o.mod||{},until:day()+dur});
  recomputeMods();
  let extra='';
  if(o.start){const r=o.start();if(r)extra=r}
  if(o.follow&&Math.random()<o.follow[1])G.queue.push({id:o.follow[0],on:day()+1});
  news(`${SEVN[t.sev]}: ${o.name}. ${o.desc}${extra?' '+extra:''}`,t.sev);
  if(t.sev>=3)quip('disaster');
  if(t.sev>=3)alertQ.push({sev:t.sev,name:o.name,desc:o.desc,extra});
  else notify(`${o.name}. ${o.desc}`);
}
function rollEvent(){
  if(G.evs.length>=3||Math.random()>.55)return;
  const k=1+day()/60;
  const pool=EVT.filter(t=>!G.evs.some(e=>e.id===t.id)).map(t=>({t,w:t.w*(t.sev>=4?k:1)}));
  const tot=pool.reduce((s,x)=>s+x.w,0);let r=Math.random()*tot;
  for(const x of pool){r-=x.w;if(r<=0){startEvent(x.t);return}}
}
function dayNews(){
  if(G.ev)news(`${G.ev.name}. ${G.ev.desc}`,2);
  G.evs=G.evs.filter(e=>{if(day()>=e.until){news(`${e.name} is over.`,1);return false}return true});
  G.queue=G.queue.filter(q=>{
    if(day()>=q.on){const t=EVT.find(x=>x.id===q.id);if(t&&!G.evs.some(e=>e.id===t.id))startEvent(t);return false}
    return true;
  });
  rollEvent();
  recomputeMods();
  ambientNews();
}

function threadsHourly(){
  G.threads.active.slice().forEach(th=>{
    const T=THREADS[th.tid],B=T.beats[th.beat];
    if(!th.pending){
      if(G.t>=th.due){th.pending=true;th.since=day();notify(`New message: ${T.title}. Check Phone, then Threads.`);news(`New message in "${T.title}".`,1)}
    }else if(day()-th.since>=(B.timeout||3)){th.log.push('You did not respond.');advanceThread(th,B.ignore,false)}
  });
}
function threadsDaily(){
  const S=G.threads;
  if(S.active.length>=2||day()<4||day()-S.lastStart<5)return;
  const used=new Set([...S.active.map(t=>t.tid),...S.done.map(t=>t.tid)]);
  const c=Object.keys(THREADS).filter(id=>!used.has(id)&&THREADS[id].hook());
  if(!c.length)return;
  const id=pick(c),def=THREADS[id];
  S.active.push({tid:id,beat:'b1',due:G.t+60*ri(3,10),pending:false,since:0,log:[],roles:def.start?def.start():{}});
  S.lastStart=day();
}
function advanceThread(th,next,interactive){
  if(next.startsWith('END:'))return endThread(th,next.slice(4),interactive);
  th.beat=next;th.pending=false;th.due=G.t+(THREADS[th.tid].beats[next].wait||0)*1440;
  if(interactive)threadsMenu('Sent. The story waits for you, and the world does not.');
}
function endThread(th,key,interactive){
  const T=THREADS[th.tid],E=T.endings[key];
  const extra=(E.fx&&E.fx(th))||'';
  G.threads.active=G.threads.active.filter(x=>x!==th);
  G.threads.done.unshift({tid:th.tid,title:T.title,end:E.name,text:fmt(th,E.text),extra,harbor:E.harbor||'',day:day(),log:th.log});
  news(`Story ended: ${T.title}. ${E.name}.`,2);
  if(interactive)threadEnding(G.threads.done[0]);
  else notify(`${T.title} ended without you: ${E.name}.`);
}
function threadEnding(d){
  ui(`<h2>${esc(d.title)}</h2><p class="muted small">Ending: ${esc(d.end)} (day ${d.day})</p><p>${esc(d.text)}</p>${d.extra?`<p class="amber">${esc(d.extra)}</p>`:''}${d.harbor?`<p class="muted">${esc(d.harbor)}</p>`:''}
    ${d.log.length?`<p class="muted small">Your choices: ${d.log.map(esc).join(', then ')}.</p>`:''}`,[{label:'Back',cls:'quiet',fn:()=>threadsMenu()}]);
}
function threadBeat(th){
  const T=THREADS[th.tid],B=T.beats[th.beat];
  const btns=B.choices.map(c=>({label:c.label,sub:typeof c.sub==='function'?c.sub():c.sub,off:c.need?!c.need():false,cls:'',fn:()=>{
    if(c.fx)c.fx(th);th.log.push(c.label);advanceThread(th,c.next,true)}}));
  ui(`<h2>${esc(T.title)}</h2><p class="muted small">${esc(T.from)}</p><p>${esc(fmt(th,B.text))}</p><p class="muted small">Leave it ${B.timeout||3} days and it resolves without you.</p>`,[...btns,{label:'Back',cls:'quiet',fn:()=>threadsMenu()}]);
}
function threadsMenu(msg){
  const S=G.threads;
  ui(`<h2>Threads</h2><p class="muted">Stories that find you. Ignore them and they happen anyway.</p>${msgP(msg)}${S.active.length?'':'<p class="muted">Nothing is looking for you yet.</p>'}`,[
    ...S.active.map(th=>({label:THREADS[th.tid].title,sub:th.pending?'New message. Tap to read.':'Waiting for the next update',cls:th.pending?'primary':'',off:!th.pending,fn:()=>threadBeat(th)})),
    ...(S.done.length?[{label:'Past stories',sub:`${S.done.length} finished`,cls:'',fn:threadsPast}]:[]),
    {label:'Back',cls:'quiet',fn:()=>phone()}]);
}
function threadsPast(){
  ui(`<h2>Past stories</h2>`,[...G.threads.done.map(d=>({label:d.title,sub:`${d.end}, day ${d.day}`,cls:'',fn:()=>threadEnding(d)})),{label:'Back',cls:'quiet',fn:()=>threadsMenu()}]);
}

function collapse(){
  const cost=Math.min(G.cash,15);G.cash-=cost;
  advance(360,true,true);
  G.energy=55;G.hunger=Math.max(G.hunger,35);quip('collapse');
  const c=POIS.clinic;G.p.x=c.ex;G.p.y=c.ey;G.p.path=[];G.p.onArrive=null;
  hud();
  ui(`<h2>You collapsed</h2><p>You wake at Bell Clinic. Six hours are gone${cost?` and the fee was ${money(cost)}`:''}.</p>`,[{label:'Get up',fn:closeMenu}],true,false);
}

const cv=$('#scene'),cx=cv.getContext('2d'),stage=$('#stage');
let camX=0,camY=0,dest=null,last=performance.now();
function fitCanvas(){
  const r=stage.getBoundingClientRect();if(!r.width)return;
  const s=r.width/VW;VH=Math.max(96,Math.round(r.height/s));
  if(cv.width!==VW)cv.width=VW;if(cv.height!==VH)cv.height=VH;
}
new ResizeObserver(fitCanvas).observe(stage);window.addEventListener('resize',fitCanvas);fitCanvas();

function walkTo(tx,ty,then){
  const p=G.p;
  const sx=p.path.length?p.path[0][0]:Math.round(p.x),sy=p.path.length?p.path[0][1]:Math.round(p.y);
  const path=bfs(sx,sy,tx,ty);
  if(!path)return notify('You cannot get there.');
  p.path=p.path.length?[p.path[0],...path]:path;
  p.onArrive=then||null;dest=[tx,ty];
  if(!p.path.length&&then){p.onArrive=null;then()}
}
function goPOI(poi){worldPanel();walkTo(poi.ex,poi.ey,()=>openPOI(poi))}
function goTalk(n){
  const p=G.p;
  if(Math.hypot(n.x-p.x,n.y-p.y)<=1.6){p.path=[];return talk(n)}
  walkTo(Math.round(n.x),Math.round(n.y),()=>talk(n));
}
cv.addEventListener('pointerdown',e=>{
  if(!G)return;
  e.preventDefault();
  if(modal){if(!dismissable)return;worldPanel()}
  const r=cv.getBoundingClientRect();
  const fx=((e.clientX-r.left)/r.width*VW+camX)/TS,fy=((e.clientY-r.top)/r.height*VH+camY)/TS;
  const tx=Math.floor(fx),ty=Math.floor(fy);
  if(tx<0||ty<0||tx>=W||ty>=H)return;
  if(placing)return tryPlace(tx,ty);
  let best=null,bd=1.3;
  NPCS.forEach(n=>{if(n.indoors)return;const d=Math.hypot(n.x+.5-fx,n.y+.5-fy);if(d<bd){bd=d;best=n}});
  if(best)return goTalk(best);
  const stop=STOPS.find(s=>Math.abs(s.x-tx)<=0&&Math.abs(s.y-ty)<=0);
  if(stop)return walkTo(tx,ty,()=>stopMenu(stop));
  const st=structAt(tx,ty);
  if(st)return walkTo(tx,ty,()=>structMenu(st));
  const t=map[ty][tx];
  if(t===T.BLD){
    const b=blocks.find(b=>tx>=b.x&&tx<b.x+4&&ty>=b.y&&ty<b.y+4);
    if(b&&b.poi)return goPOI(POIS[b.poi]);
    if(b)return walkTo(b.x+1,b.y+4,()=>propertyMenu(b));
    return;
  }
  if(t===T.FARM){const pl=G.plots.find(q=>q.x===tx&&q.y===ty);return walkTo(tx,ty,()=>plotMenu(pl))}
  if(t===T.PLAZA)return walkTo(tx,ty,()=>plazaMenu());
  if(t===T.DOCK)return walkTo(tx,ty,()=>waterfront());
  if(t===T.WATER)return notify('Deep water.');
  walkTo(tx,ty);
});

    if(hz&&!v&&tx%2===0)cx.fillRect(sx+3,sy+7,5,2);
    if(tx>=41&&tx<=44){cx.fillStyle='#d8d0b8';cx.fillRect(sx,sy,TS,2);cx.fillRect(sx,sy+TS-2,TS,2)}
    if(d==='Neon Mile'&&h%7===0){cx.fillStyle='rgba(255,80,200,.35)';cx.fillRect(sx+2,sy+2,3,1)}
  }else if(t===T.FARM){
    cx.fillStyle='#6f5237';cx.fillRect(sx,sy,TS,TS);cx.fillStyle='#5c4229';
    for(let i=2;i<TS;i+=4)cx.fillRect(sx,sy+i,TS,1);
    const pl=G&&G.plots.find(q=>q.x===tx&&q.y===ty);
    if(pl&&pl.s===1){cx.fillStyle='#6fbf5a';cx.fillRect(sx+4,sy+6,2,4);cx.fillRect(sx+10,sy+6,2,4)}
    if(pl&&pl.s===2){cx.fillStyle='#e0b83a';cx.fillRect(sx+3,sy+4,3,7);cx.fillRect(sx+10,sy+4,3,7)}
  }else if(t===T.PLAZA){
    cx.fillStyle=(tx+ty)%2?'#cfc5ae':'#c4baa2';cx.fillRect(sx,sy,TS,TS);
  }else if(t===T.DOCK){
    cx.fillStyle='#8b6a47';cx.fillRect(sx,sy,TS,TS);cx.fillStyle='#6e5236';
    for(let i=0;i<TS;i+=4)cx.fillRect(sx+i,sy,1,TS);
    if(tideV()>.45){cx.fillStyle='rgba(44,91,120,.4)';cx.fillRect(sx,sy+8,TS,8)}
  }else if(t===T.LOT){
    cx.fillStyle='#b3a587';cx.fillRect(sx,sy,TS,TS);cx.fillStyle='#9a8d70';cx.fillRect(sx+3,sy+5,2,1);cx.fillRect(sx+10,sy+11,3,1);
  }else if(t===T.BLD){
    cx.fillStyle='#3b3f48';cx.fillRect(sx,sy,TS,TS);
  }else{
    cx.fillStyle=GROUND[d];cx.fillRect(sx,sy,TS,TS);
    cx.fillStyle='rgba(0,0,0,.08)';if(h%5===0)cx.fillRect(sx+(h>>3)%12,sy+(h>>5)%12,2,1);
    if(t===T.PARK?h%3===0:(h%9===0&&(d==='Highline'||d==='Greenbelt')))tree(sx,sy);
  }
}
function drawBlock(b,lit,now){
  const sx=b.x*TS-camX,sy=b.y*TS-camY,w=4*TS,hh=4*TS;
  const biz=G&&!b.poi?bizOf(b.key):null;
  const bt=biz&&biz.type?BT[biz.type]:null;
  const c=bt?bt.col:COL[b.kind];
  cx.fillStyle='rgba(0,0,0,.22)';cx.fillRect(sx+4,sy+hh-2,w-4,3);
  cx.fillStyle=c[1];cx.fillRect(sx+2,sy+hh-20,w-4,18);
  cx.fillStyle=c[0];cx.fillRect(sx+2,sy+2,w-4,hh-22);
  cx.fillStyle='rgba(255,255,255,.25)';cx.fillRect(sx+2,sy+2,w-4,2);
  cx.fillStyle='rgba(0,0,0,.18)';cx.fillRect(sx+2,sy+hh-22,w-4,2);
  for(let i=0;i<3;i++){cx.fillStyle=lit?'#ffd88a':'#2c3440';cx.fillRect(sx+34+i*9,sy+hh-16,7,6)}
  cx.fillStyle='#2a1c12';cx.fillRect(sx+TS+3,sy+hh-12,10,10);
  const label=b.poi?SIGN[b.kind]:bt?bt.sign:null;
  cx.font='7px Silkscreen, monospace';cx.textAlign='center';
  if(label){cx.fillStyle='rgba(0,0,0,.45)';cx.fillRect(sx+6,sy+10,w-12,12);cx.fillStyle='#fff';cx.fillText(label,sx+w/2,sy+19)}
  else if(!b.poi&&!biz){
    cx.fillStyle='#fff';cx.fillRect(sx+10,sy+8,w-20,14);cx.fillStyle='#d94a3a';cx.fillRect(sx+10,sy+8,w-20,3);
    cx.fillStyle='#8a2a1a';cx.fillText('FOR SALE',sx+w/2,sy+19);
  }else if(biz&&!bt){cx.fillStyle='rgba(0,0,0,.4)';cx.fillRect(sx+8,sy+10,w-16,12);cx.fillStyle='#ffd88a';cx.fillText('YOURS',sx+w/2,sy+19)}
  if(biz){cx.fillStyle='#4fd1b5';cx.fillRect(sx+w-10,sy-4,1,10);cx.fillRect(sx+w-9,sy-4,6,4)}
  if(b.poi&&(b.kind==='casino'||b.kind==='velvet')&&lit&&Math.floor(now/400)%2){cx.fillStyle='#ff5ad0';cx.fillRect(sx+4,sy+4,w-8,1)}
}
function drawStop(s){
  const sx=s.x*TS-camX,sy=s.y*TS-camY;
  cx.fillStyle='#2a3140';cx.fillRect(sx+7,sy-2,2,14);
  cx.fillStyle='#3a86d6';cx.fillRect(sx+2,sy-6,12,8);cx.fillStyle='#fff';cx.fillRect(sx+4,sy-4,8,1);cx.fillRect(sx+4,sy-2,5,1);
}
function drawStruct(st,now){
  const sx=st.x*TS-camX,sy=st.y*TS-camY;
  cx.fillStyle='rgba(0,0,0,.2)';cx.fillRect(sx+1,sy+14,14,2);
  if(st.type==='stall'){
    for(let i=0;i<4;i++){cx.fillStyle=i%2?'#e8e0c8':'#4fd1b5';cx.fillRect(sx+1+i*3.5,sy+1,4,5)}
    cx.fillStyle='#8a5a30';cx.fillRect(sx+2,sy+7,12,7);
    const any=Object.values(st.stock).some(v=>v>0);
    cx.fillStyle=any?'#e0b83a':'#5a3a1c';cx.fillRect(sx+4,sy+8,3,2);cx.fillRect(sx+9,sy+8,3,2);
  }else if(st.type==='planter'){
    cx.fillStyle='#6b4a2c';cx.fillRect(sx+2,sy+9,12,5);
    cx.fillStyle='rgba(200,235,240,.6)';cx.fillRect(sx+2,sy+3,12,6);
    if(st.s===1){cx.fillStyle='#6fbf5a';cx.fillRect(sx+5,sy+6,2,3);cx.fillRect(sx+9,sy+6,2,3)}
    if(st.s===2){cx.fillStyle='#e0b83a';cx.fillRect(sx+4,sy+4,3,5);cx.fillRect(sx+9,sy+4,3,5)}
  }else if(st.type==='smoker'){
    cx.fillStyle='#3a3a40';cx.fillRect(sx+4,sy+4,8,10);cx.fillStyle='#e07a3a';cx.fillRect(sx+6,sy+10,4,2);
    cx.fillStyle='rgba(200,200,200,.6)';cx.fillRect(sx+7,sy+1-(Math.floor(now/400)%2),2,2);
  }else if(st.type==='bench'){
    cx.fillStyle='#8a6a40';cx.fillRect(sx+2,sy+7,12,3);cx.fillRect(sx+3,sy+10,2,4);cx.fillRect(sx+11,sy+10,2,4);
    cx.fillStyle='#c0c4c8';cx.fillRect(sx+5,sy+4,5,2);
  }else if(st.type==='house'){
    cx.fillStyle='#b58a5a';cx.fillRect(sx+2,sy+6,12,8);cx.fillStyle='#8a3a2a';cx.fillRect(sx+1,sy+2,14,5);cx.fillStyle='#2a1c12';cx.fillRect(sx+7,sy+9,3,5);
  }else{
    cx.fillStyle='#5b3d24';cx.fillRect(sx+7,sy+6,2,8);cx.fillStyle='#e0c070';cx.fillRect(sx+3,sy+2,10,6);cx.fillStyle='#8a5a30';cx.fillRect(sx+5,sy+4,6,1);
  }
}
function person(x,y,col,isP,moving,now,headOnly){
  const px=Math.round(x*TS+8-camX),py=Math.round(y*TS+14-camY);
  const sw=moving&&Math.floor(now/140)%2;
  if(isP&&G&&G.look)return drawPlayer(cx,px,py,G.look,sw,headOnly,Math.floor(now/300)%2);
  if(!headOnly){
    cx.fillStyle='rgba(0,0,0,.25)';cx.fillRect(px-3,py,7,2);
    cx.fillStyle='#2b2118';cx.fillRect(px-3+(sw?1:0),py-3,2,3);cx.fillRect(px+1-(sw?1:0),py-3,2,3);
    cx.fillStyle=col;cx.fillRect(px-3,py-9,6,7);
  }
  cx.fillStyle='#e8c39e';cx.fillRect(px-2,py-13,4,4);
  cx.fillStyle='#2b2118';cx.fillRect(px-2,py-13,4,1);
  if(isP){cx.fillStyle='#4fd1b5';cx.fillRect(px-1,py-18+(Math.floor(now/300)%2),2,3);if(!headOnly){cx.fillStyle='#fff';cx.fillRect(px-3,py-9,6,1)}}
}
function drawVeh(k,x,y,now,mv){
  const px=Math.round(x*TS+8-camX),py=Math.round(y*TS+14-camY),sp=mv?Math.floor(now/90)%2:0;
  if(k==='bike'){
    cx.lineWidth=2;cx.strokeStyle='#f2f2f2';cx.beginPath();cx.arc(px-5,py-2,3,0,7);cx.stroke();cx.beginPath();cx.arc(px+5,py-2,3,0,7);cx.stroke();
    cx.lineWidth=1;cx.strokeStyle='#1c1c1c';cx.beginPath();cx.arc(px-5,py-2,3.6,0,7);cx.stroke();cx.beginPath();cx.arc(px+5,py-2,3.6,0,7);cx.stroke();
    cx.fillStyle='#e0402f';cx.fillRect(px-5,py-6,10,2);cx.fillRect(px+3,py-9,2,5);cx.fillRect(px-6,py-8,3,1);
  }else if(k==='scooter'){
    cx.fillStyle='#e0b83a';cx.fillRect(px-6,py-5,12,3);cx.fillRect(px+4,py-9,2,5);
    cx.fillStyle='#f2f2f2';cx.fillRect(px-7,py-3,5,5);cx.fillRect(px+2,py-3,5,5);
    cx.fillStyle='#1c1c1c';cx.fillRect(px-6,py-2,3,3);cx.fillRect(px+3,py-2,3,3);
  }else{
    const c=k==='coupe'?['#d04030','#a02a20']:['#3a7ad0','#2a5aa0'];
    cx.fillStyle='rgba(0,0,0,.25)';cx.fillRect(px-9,py,19,2);
    cx.fillStyle=c[0];cx.fillRect(px-9,py-7,18,6);cx.fillStyle=c[1];cx.fillRect(px-5,py-11,10,5);
    cx.fillStyle='#bfe3f0';cx.fillRect(px-4,py-10,8,3);
    cx.fillStyle='#1c1c1c';cx.fillRect(px-7,py-2+sp*0,4,3);cx.fillRect(px+3,py-2,4,3);
    if(k==='coupe'){cx.fillStyle='#ffe08a';cx.fillRect(px+8,py-6,2,2)}
  }
}
let pFace=1;
function drawRide(k,x,y,now,mv){
  const px=Math.round(x*TS+8-camX),py=Math.round(y*TS+14-camY),bike=k==='bike';
  const ph=mv?now/110:0,L=G.look,oc=L?outfitOf(L.outfit).c:'#2f6fb3',sk=L?(SKIN[L.skin]||SKIN[1]):'#e8c39e';
  cx.save();cx.translate(px,py);cx.scale(pFace,1);
  cx.fillStyle='rgba(0,0,0,.25)';cx.fillRect(-8,0,17,2);
  const wheel=(wx,r)=>{
    cx.lineWidth=2;cx.strokeStyle='#f2f2f2';cx.beginPath();cx.arc(wx,-3,r,0,7);cx.stroke();
    cx.lineWidth=1;cx.strokeStyle='#1c1c1c';cx.beginPath();cx.arc(wx,-3,r+.7,0,7);cx.stroke();
    cx.beginPath();cx.moveTo(wx+Math.cos(ph)*r,-3+Math.sin(ph)*r);cx.lineTo(wx-Math.cos(ph)*r,-3-Math.sin(ph)*r);cx.stroke();
  };
  if(bike){
    wheel(-5,3);wheel(5,3);
    cx.lineWidth=1.5;cx.strokeStyle='#e0402f';cx.beginPath();cx.moveTo(-5,-3);cx.lineTo(-2,-8);cx.lineTo(4,-8);cx.lineTo(5,-3);cx.moveTo(-2,-8);cx.lineTo(0,-3);cx.lineTo(4,-8);cx.moveTo(4,-8);cx.lineTo(4,-11);cx.stroke();
    cx.fillStyle='#1c1c1c';cx.fillRect(-4,-9,4,1);cx.fillRect(3,-12,3,1);
    const fx=Math.cos(ph)*2,fy=Math.sin(ph)*2;
    cx.strokeStyle='#2b2118';cx.lineWidth=2;cx.beginPath();cx.moveTo(-2,-8);cx.lineTo(0+fx,-3+fy);cx.stroke();
    cx.fillStyle=oc;cx.fillRect(-3,-14,5,6);
    cx.fillStyle=sk;cx.fillRect(2,-12,3,2);
    if(L)drawPlayer(cx,1,-6,L,0,true,0);else{cx.fillStyle=sk;cx.fillRect(0,-19,4,4)}
  }else{
    wheel(-5,2);wheel(5,2);
    cx.fillStyle='#e0b83a';cx.fillRect(-6,-5,12,2);cx.fillRect(4,-14,2,10);cx.fillStyle='#1c1c1c';cx.fillRect(3,-15,4,1);
    cx.fillStyle='#2b2118';cx.fillRect(-2,-6,4,2);
    cx.fillStyle=oc;cx.fillRect(-3,-10,6,5);
    cx.fillStyle=sk;cx.fillRect(3,-10,2,2);
    if(L)drawPlayer(cx,0,-1,L,0,true,0);else{cx.fillStyle=sk;cx.fillRect(-2,-19,4,4)}
  }
  cx.restore();
}
function drawWorld(now){
  const x0=Math.floor(camX/TS),y0=Math.floor(camY/TS);
  for(let ty=y0;ty<=y0+Math.ceil(VH/TS);ty++)for(let tx=x0;tx<=x0+Math.ceil(VW/TS);tx++){
    if(tx<0||ty<0||tx>=W||ty>=H)continue;
    drawTile(tx,ty,now);
    if(placing&&canBuild(tx,ty)){const sx=tx*TS-camX,sy=ty*TS-camY;cx.fillStyle='rgba(79,209,181,.28)';cx.fillRect(sx,sy,TS,TS);cx.fillStyle='rgba(79,209,181,.9)';cx.fillRect(sx,sy,3,1);cx.fillRect(sx,sy,1,3);cx.fillRect(sx+TS-3,sy+TS-1,3,1);cx.fillRect(sx+TS-1,sy+TS-3,1,3)}
  }
  const n=night(),lit=n>.2;
  blocks.forEach(b=>{
    const sx=b.x*TS-camX,sy=b.y*TS-camY;
    if(sx>VW||sy>VH||sx<-64||sy<-64)return;
    drawBlock(b,lit,now);
  });
  STOPS.forEach(s=>{const sx=s.x*TS-camX,sy=s.y*TS-camY;if(sx>-16&&sx<VW&&sy>-16&&sy<VH)drawStop(s)});
  const fx=23*TS-camX,fy=15*TS-camY;
  cx.fillStyle='#8aa6b5';cx.beginPath();cx.arc(fx,fy,10,0,7);cx.fill();
  cx.fillStyle='#4f86a6';cx.beginPath();cx.arc(fx,fy,7,0,7);cx.fill();
  cx.fillStyle='#cfe3ee';cx.fillRect(fx-1,fy-3+Math.sin(now*.005),2,4);
  if(G){
    const ents=[];
    G.structs.forEach(s=>ents.push({y:s.y-.5,f:()=>drawStruct(s,now)}));
    NPCS.forEach(n=>{if(!n.indoors)ents.push({y:n.y,f:()=>person(n.x,n.y,n.col,false,n.path.length>0,now)})});
    ents.push({y:G.p.y,f:()=>{
      const a=G.veh.active,mv=G.p.path.length>0;
      if(mv){const dx=G.p.path[0][0]-G.p.x;if(Math.abs(dx)>.05)pFace=dx>0?1:-1}
      if(a==='bike'||a==='scooter')drawRide(a,G.p.x,G.p.y,now,mv);
      else if(a==='sedan'||a==='coupe'){
        const mx=Math.round(G.p.x*TS+8-camX);
        cx.save();cx.translate(mx,0);cx.scale(pFace,1);cx.translate(-mx,0);
        drawVeh(a,G.p.x,G.p.y,now,mv);person(G.p.x,G.p.y-.15,'#2f6fb3',true,mv,now,true);cx.restore();
      }else person(G.p.x,G.p.y,'#2f6fb3',true,mv,now);
    }});
    ents.sort((a,b)=>a.y-b.y).forEach(e=>e.f());
    if(dest&&G.p.path.length){
      const dx=dest[0]*TS-camX,dy=dest[1]*TS-camY;
      cx.strokeStyle='#4fd1b5';cx.lineWidth=1;cx.strokeRect(dx+1.5,dy+1.5,TS-3,TS-3);
    }
    if(G.mission){
      const poi=POIS[G.mission.stops[G.mission.i]],mx=poi.ex*TS-camX+8,my=poi.ey*TS-camY+8;
      const ax=clamp(mx,6,VW-6),ay=clamp(my,6,VH-6),pulse=2+Math.sin(now*.008)*1.5;
      cx.fillStyle='#ffd88a';cx.beginPath();cx.arc(ax,ay,3+pulse*.4,0,7);cx.fill();
      cx.strokeStyle='#ffd88a';cx.beginPath();cx.arc(ax,ay,6+pulse,0,7);cx.stroke();
    }
  }
  if(G&&G.gps){
    cx.fillStyle='#4fd1b5';
    const off=Math.floor(now/180);
    for(let i=0;i<gpsPath.length;i++){
      if((i+off)%3)continue;
      const gsx=gpsPath[i][0]*TS-camX+7,gsy=gpsPath[i][1]*TS-camY+7;
      if(gsx<-3||gsy<-3||gsx>VW||gsy>VH)continue;
      cx.fillRect(gsx,gsy,3,3);
    }
    const gx=G.gps.x*TS-camX+8,gy=G.gps.y*TS-camY+8;
    if(gx<0||gy<0||gx>VW||gy>VH){cx.beginPath();cx.arc(clamp(gx,6,VW-6),clamp(gy,6,VH-6),4,0,7);cx.fill()}
    else{cx.strokeStyle='#4fd1b5';cx.strokeRect(gx-7,gy-7,14,14)}
  }
  if(n>0){cx.fillStyle=`rgba(12,18,48,${n})`;cx.fillRect(0,0,VW,VH)}
  if(G&&G.heat>=2&&NPC.reyes.chasing){const f=Math.floor(now/180)%2;cx.fillStyle=f?'rgba(220,40,40,.35)':'rgba(50,90,230,.35)';cx.fillRect(0,0,VW,3);cx.fillRect(0,VH-3,VW,3)}
}
let hudT=0,missT=0;
function tick(dt){
  if(alertQ.length){showAlert();return}
  const p=G.p;
  advance(dt*6,false,true);
  const R=NPC.reyes;
  if(G.veh.active!=='none'&&G.veh.stolen[G.veh.active]){G.heat=Math.max(G.heat,1.2);if(!R.indoors&&Math.hypot(R.x-p.x,R.y-p.y)<7)G.heat=Math.max(G.heat,3)}
  if(G.heat>=2){
    if(!R.chasing){R.chasing=true;if(R.indoors){R.indoors=false;R.x=POIS[R.home].ex;R.y=POIS[R.home].ey}notify('Wanted! Constable Reyes is after you. Outrun him and lay low.');quip('wanted')}
    R.rt-=dt;if(R.rt<=0){R.rt=.6;goto(R,[Math.round(p.x),Math.round(p.y)])}
    moveEnt(R,dt,(G.heat>=4?4.6:3.6)+(G.mod.cops?.5:0));
    if(Math.hypot(R.x-p.x,R.y-p.y)<1.2)return bust();
  }else if(R.chasing){R.chasing=false;assign(R,true);notify('You lost them. Lay low.')}
  NPCS.forEach(n=>{
    if(n.indoors||(n===R&&R.chasing))return;
    moveEnt(n,dt,2.6);
    if(!n.path.length&&n.goHome&&n.act==='home')n.indoors=true;
  });
  const v=VEH[G.veh.active];
  let sp=v.sp*G.mod.vspeed;
  if(v.fuel&&(G.veh.fuel[G.veh.active]||0)<=0)sp=3;
  if(G.energy<15||G.hunger<10)sp=Math.min(sp,2.6);
  if(G.mod.flood.includes(district(Math.round(p.x),Math.round(p.y))))sp*=.55;
  const bx=p.x,by=p.y,was=p.path.length>0;
  moveEnt(p,dt,sp);
  if(v.fuel&&was){const dd=Math.hypot(p.x-bx,p.y-by);G.veh.fuel[G.veh.active]=Math.max(0,(G.veh.fuel[G.veh.active]||0)-dd*.12);if(G.veh.fuel[G.veh.active]<=0&&!G.flags.fuelNote){G.flags.fuelNote=1;notify('Out of fuel. Refuel at Mack\'s Garage.')}if(G.veh.fuel[G.veh.active]>15)G.flags.fuelNote=0}
  if(was&&!p.path.length&&p.onArrive){const f=p.onArrive;p.onArrive=null;f()}
  missT+=dt;if(missT>.25){missT=0;missionTick();gpsTick();if(G.cash>=1000)quip('rich');else if(G.cash<5)quip('broke')}
  hudT+=dt;if(hudT>.3){hudT=0;hud()}
  if(!modal&&(G.energy<=0||G.hunger<=0))collapse();
}
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  requestAnimationFrame(frame);
  try{if(G&&!modal)tick(dt)}catch(e){console.error(e)}
  if(G){
    camX=Math.round(clamp(G.p.x*TS+8-VW/2,0,W*TS-VW));camY=Math.round(clamp(G.p.y*TS+8-VH/2,0,Math.max(0,H*TS-VH)));
  }else{
    camX=Math.round((Math.sin(now*.00008)*.5+.5)*(W*TS-VW));camY=Math.round((Math.sin(now*.00006+1)*.5+.5)*Math.max(0,H*TS-VH));
  }
  try{drawWorld(now)}catch(e){console.error(e)}
}
title();
requestAnimationFrame(frame);
})();
</script>
