<title>Marrow Bay</title>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=5">

<body>
<div id="app">
  <header id="hud" hidden>
    <dl class="stats">
      <div><dt><span id="h-ico"></span><span id="h-day">Day 1</span></dt><dd id="h-time"></dd></div>
      <div><dt>Cash</dt><dd id="h-cash"></dd></div>
      <div><dt>District</dt><dd id="h-dist"></dd></div>
      <div><dt>Tide</dt><dd id="h-tide"></dd></div>
    </dl>
    <div class="bars">
      <div class="bar"><i id="b-hunger"></i><span id="t-hunger">Fed</span></div>
      <div class="bar"><i id="b-energy"></i><span id="t-energy">Rested</span></div>
      <div class="bar heat"><i id="b-heat" style="width:0"></i><span id="t-heat">Clear</span></div>
    </div>
  </header>
  <div id="stage">
    <canvas id="scene" width="176" height="200" aria-label="Map of Marrow Bay"></canvas>
    <div id="note" aria-live="polite"></div>
    <div id="mission" hidden></div>
    <section id="sheet" hidden aria-live="polite"><button type="button" id="xbtn" aria-label="Close">&times;</button><div id="text"></div><div id="actions"></div></section>
  </div>
  <nav id="bar" hidden>
    <button type="button" id="b-bag">Bag</button>
    <button type="button" id="b-build">Build</button>
    <button type="button" id="b-biz">Biz</button>
    <button type="button" id="b-phone">Phone</button>
    <button type="button" id="b-go">Go</button>
  </nav>
</div>
